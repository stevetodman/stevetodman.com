<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Step-by-step cooking timers with audio alerts, progress tracking, and doneness cues.">
<title>Cooking Timers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      padding: 24px;
    }
    .back-link {
      display: inline-block;
      color: #00cec9;
      text-decoration: none;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 2rem; text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; opacity: 0.7; margin-bottom: 32px; font-size: 1rem; }
    .timers { max-width: 600px; margin: 0 auto; }
    .timer-card {
      background: #1e3a5f;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      text-decoration: none;
      color: #fff;
      display: block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .timer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 184, 148, 0.2);
    }
    .timer-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .timer-meta { font-size: 0.9rem; opacity: 0.7; }
    .timer-time {
      display: inline-block;
      background: rgba(0, 184, 148, 0.2);
      color: #2ee6e0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-top: 10px;
    }
      a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #00cec9; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <a href="/" class="back-link">← Back to Home</a>
  <h1>🍳 Cooking Timers</h1>
  <p class="subtitle">Step-by-step timers for complex recipes</p>
  <div class="timers">
    <a href="ahi-tuna-timer.html" class="timer-card">
      <div class="timer-title">🍳 Pan Seared Ahi Tuna</div>
      <div class="timer-meta">Sesame-Crusted • ~9 minutes total</div>
      <span class="timer-time">~9 minutes total</span>
    </a>
    <a href="ribeye-timer.html" class="timer-card">
      <div class="timer-title">🍖 Pan Seared Rib Eye</div>
      <div class="timer-meta">Alton Brown • ~20 minutes total</div>
      <span class="timer-time">~20 minutes total</span>
    </a>
    <a href="ribs-timer.html" class="timer-card">
      <div class="timer-title">🍖 Baby Back Ribs</div>
      <div class="timer-meta">Alton Brown • Good Eats • ~4.5 hours total</div>
      <span class="timer-time">~4.5 hours total</span>
    </a>
  </div>
</main>
</body>
</html>
