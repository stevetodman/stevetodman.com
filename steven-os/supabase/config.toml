# Auth is enforced inside each function. Current Supabase secret API keys and
# GitHub OIDC tokens are not Supabase user JWTs, so gateway JWT verification
# is intentionally disabled for these server-to-server endpoints.
[functions.steven-os-ingest]
verify_jwt = false

[functions.steven-os-brief]
verify_jwt = false

[functions.steven-os-github-ingest]
verify_jwt = false

[functions.steven-os-resolve]
verify_jwt = false
