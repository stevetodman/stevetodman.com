<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b0d10">
  <title>Steven OS</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="os">
    <header class="os-top">
      <div>
        <div class="eyebrow">Steven OS · <span id="mode">loading</span></div>
        <h1>STEVEN OS</h1>
      </div>
      <div class="freshness">Snapshot <span id="generated">—</span></div>
    </header>

    <div id="app-error" class="error" hidden></div>

    <section class="board" aria-label="Operating picture">
      <section class="band">
        <header class="band-head">
          <h2>Needs You</h2>
          <strong id="needs-count">—</strong>
        </header>
        <div id="needs-you" class="rows"></div>
      </section>

      <section class="band">
        <header class="band-head">
          <h2>Agents Working</h2>
          <strong id="working-count">—</strong>
        </header>
        <div id="working" class="rows"></div>
      </section>

      <section class="band">
        <header class="band-head">
          <h2>Blocked</h2>
          <strong id="blocked-count">—</strong>
        </header>
        <div id="blocked" class="rows"></div>
      </section>

      <section class="band">
        <header class="band-head">
          <h2>Completed since yesterday</h2>
          <strong id="shipped-count">—</strong>
        </header>
        <div id="shipped" class="rows"></div>
      </section>
    </section>

    <details class="registry">
      <summary>Project registry <span id="project-count"></span></summary>
      <div id="projects" class="projects"></div>
    </details>
  </main>
  <script src="./config.js"></script>
  <script src="./config.local.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
