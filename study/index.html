<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="One-tap vocabulary and spelling practice.">
  <meta name="theme-color" content="#17324d">
  <title>Unit 1 Word Expedition</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="/study/us-states.webmanifest">
  <link rel="stylesheet" href="/study/unit-1/app.css">
  <style>
    /* Keep the core combat loop visible when mobile browser chrome leaves a short viewport. */
    @media (max-height:550px) and (max-width:560px) {
      body[data-screen="question"] .topbar { margin-bottom:8px; }
      body[data-screen="question"] .mission-head { display:flex; margin-bottom:6px; }
      body[data-screen="question"] .battle-stage { display:block; padding:6px 8px 7px; margin-bottom:8px; }
      body[data-screen="question"] .battle-scene { height:64px; padding:0 17%; }
      body[data-screen="question"] .fighter { width:68px; height:68px; }
      body[data-screen="question"] .battle-hud { font-size:.52rem; }
      body[data-screen="question"] .level-chip,
      body[data-screen="question"] .coin-chip { min-height:21px; padding:2px 7px; }
      body[data-screen="question"] .battle-status { display:none; }
      body[data-screen="question"] .shield-row { margin:0 10%; }
    }
    /* Only while a software keyboard is consuming an extremely short viewport, prioritize the typing control. */
    @media (max-height:450px) and (max-width:560px) {
      body[data-screen="question"]:has(#answer-input:focus) .mission-head,
      body[data-screen="question"]:has(#answer-input:focus) .battle-stage { display:none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-lockup">
        <p class="kicker">Unit 1 · 12 words</p>
        <h1>Word Expedition</h1>
      </div>
      <button class="profile-chip" id="profile-chip" type="button" aria-label="Switch learner" hidden></button>
    </header>
    <p class="save-warning" id="save-warning" role="status" hidden></p>
    <div id="app" aria-live="polite"></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/study/unit-1/game-art.js"></script>
  <script src="/study/unit-1/quality-core.js"></script>
  <script src="/study/unit-1/audio-unlock.js"></script>
  <script src="/study/unit-1/app.js"></script>
</body>
</html>
