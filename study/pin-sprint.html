<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Pin Sprint — a fast, kid-friendly U.S. states map game that shares progress with the 50 States Challenge.">
<title>Pin Sprint — 50 States</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8;
    color: #2d3748;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  main { min-width: 0; }
  .container { width: 100%; max-width: 760px; }
  h1 { text-align: center; color: #1a365d; font-size: 1.65rem; margin: 2px 0 6px; }
  .subtitle { text-align: center; color: #5a6678; font-size: 0.95rem; line-height: 1.45; margin-bottom: 18px; }
  .menu-cards { display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 18px auto 0; }
  .menu-card {
    appearance: none; width: 100%; border: 2px solid transparent; border-radius: 16px;
    background: #fff; color: inherit; padding: 22px; text-align: left; font: inherit;
    box-shadow: 0 2px 14px rgba(0,0,0,0.07); cursor: pointer;
  }
  .menu-card:hover { border-color: #667eea; box-shadow: 0 5px 20px rgba(0,0,0,0.11); }
  .menu-card .card-icon { font-size: 2rem; margin-bottom: 8px; }
  .menu-card h2 { color: #1a365d; font-size: 1.2rem; margin-bottom: 5px; }
  .menu-card p { color: #5a6678; font-size: 0.92rem; line-height: 1.45; }
  .badge { display: inline-block; background: #5b4fd1; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid #667eea; outline-offset: 2px; }
  .back-link { display: block; text-align: center; color: #4c3fbf; margin-top: 18px; font-size: 0.9rem; }

  .pin-head { position: sticky; top: max(4px, env(safe-area-inset-top)); z-index: 5; background: rgba(240,244,248,0.96); padding: 4px 0 8px; backdrop-filter: blur(8px); }
  .pin-progress { height: 7px; border-radius: 999px; overflow: hidden; background: #dbe3ec; margin: 8px 0 7px; }
  .pin-progress > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width .25s ease; }
  .pin-meta { display: flex; justify-content: space-between; gap: 10px; color: #5a6678; font-size: 0.82rem; font-weight: 600; }
  .pin-prompt { text-align: center; background: #fff; border-radius: 15px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 8px; }
  .pin-prompt .label { text-transform: uppercase; letter-spacing: .09em; color: #718096; font-size: .72rem; font-weight: 800; }
  .pin-prompt .state-name { color: #1a365d; font-weight: 800; font-size: clamp(1.45rem, 6vw, 2rem); line-height: 1.15; margin-top: 2px; }
  .pin-map-wrap { background: #fff; border-radius: 16px; padding: 5px; box-shadow: 0 3px 16px rgba(0,0,0,.09); overflow: hidden; }
  .pin-map-wrap svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .pin-map-wrap path.state { fill: #cbd5e0; stroke: #fff; stroke-width: 1.5; cursor: pointer; transition: fill .15s ease, transform .12s ease; transform-box: fill-box; transform-origin: center; }
  .pin-map-wrap path.state:hover { fill: #b5c2d4; }
  .pin-map-wrap path.pin-solved { fill: #86d7a2; }
  .pin-map-wrap path.pin-correct { fill: #38a169 !important; transform: scale(1.025); }
  .pin-map-wrap path.pin-wrong { fill: #f56565 !important; }
  .pin-map-wrap path.pin-hint { fill: #f6ad55 !important; }
  .pin-hit { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; cursor: pointer; }
  .pin-feedback { min-height: 46px; text-align: center; display: flex; align-items: center; justify-content: center; padding: 8px 6px 2px; font-size: 1rem; font-weight: 700; line-height: 1.3; }
  .pin-feedback.good { color: #2f855a; }
  .pin-feedback.try { color: #c05621; }
  .pin-tip { text-align: center; color: #718096; font-size: .78rem; min-height: 20px; }
  .pin-zoom-note { text-align: center; color: #667eea; font-size: .8rem; font-weight: 700; margin: 5px 0 0; }

  .results { max-width: 560px; margin: 0 auto; text-align: center; }
  .result-card { background: #fff; border-radius: 18px; padding: 24px 20px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .score-big { color: #667eea; font-size: 3.1rem; line-height: 1; font-weight: 800; margin: 10px 0 8px; }
  .result-label { color: #5a6678; margin-bottom: 16px; }
  .result-stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 18px; color: #4a5568; font-size: .92rem; margin-bottom: 12px; }
  .result-message { color: #2d3748; line-height: 1.45; margin: 12px auto 4px; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn-primary { color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); }
  .btn-secondary { color: #fff; background: #4a5568; }
  .engine-frame { position: fixed; width: 1px; height: 1px; left: -10000px; top: 0; border: 0; opacity: 0; pointer-events: none; }
  .error-card { max-width: 520px; margin: 20px auto; background: #fff; border-radius: 16px; padding: 22px; text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,.08); }

  @media (max-width: 640px) {
    body { padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right)); }
    .pin-map-wrap { border-radius: 12px; padding: 2px; }
    .pin-prompt { margin-left: 4px; margin-right: 4px; }
    .pin-feedback { font-size: .95rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="container" id="app">
  <h1>📍 Pin Sprint</h1>
  <p class="subtitle">Find the state, tap it, keep moving. No countdown while you play.</p>
  <div class="menu-cards">
    <button type="button" class="menu-card" id="startPin">
      <span class="badge">5–10 states</span>
      <div class="card-icon">🗺️</div>
      <h2>Start Pin Sprint</h2>
      <p>Fast map practice with the same Luke/Samantha progress and adaptive state mix as the 50 States Challenge.</p>
    </button>
  </div>
  <a class="back-link" href="us-states.html">Full 50 States Challenge</a>
  <a class="back-link" href="/study/archive/">&larr; Past practice</a>
</main>

<script>
(function() {
  "use strict";

  var app = document.getElementById("app");
  var engine = null;
  var engineFrame = null;
  var roundStates = [];
  var currentIndex = 0;
  var firstTryScore = 0;
  var attempts = 0;
  var solvedCodes = {};
  var wrongCodes = {};
  var roundStartedAt = 0;
  var startingMastered = {};
  var activeProfile = "";
  var advancing = false;
  var tinyCodes = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function loadEngine() {
    if (engine) return Promise.resolve(engine);
    return new Promise(function(resolve, reject) {
      app.innerHTML = '<h1>📍 Pin Sprint</h1><p class="subtitle">Loading your state progress…</p>';
      engineFrame = document.createElement("iframe");
      engineFrame.className = "engine-frame";
      engineFrame.id = "engineFrame";
      engineFrame.setAttribute("aria-hidden", "true");
      engineFrame.tabIndex = -1;
      engineFrame.onload = function() {
        var w = engineFrame.contentWindow;
        if (!w || !w.STATES || !w.loadData || !w.quickRoundStates || !w.recordAnswer || !w.buildMapSVG) {
          reject(new Error("50 States engine did not load"));
          return;
        }
        engine = w;
        try { engine.cancelAutoAdvance(); } catch (e) {}
        resolve(engine);
      };
      engineFrame.onerror = function() { reject(new Error("Could not load 50 States engine")); };
      engineFrame.src = "us-states.html";
      document.body.appendChild(engineFrame);
    });
  }

  function showLoadError() {
    app.innerHTML =
      '<h1>📍 Pin Sprint</h1>' +
      '<div class="error-card"><p>Pin Sprint couldn&rsquo;t load the 50 States progress engine.</p>' +
      '<div class="btn-row"><button type="button" class="btn btn-primary" id="retryLoad">Try Again</button>' +
      '<a class="btn btn-secondary" href="us-states.html">Open 50 States Challenge</a></div></div>';
    document.getElementById("retryLoad").addEventListener("click", begin);
  }

  function begin() {
    loadEngine().then(function() {
      var data = engine.loadData();
      if (!data.activeProfile) showPlayerPicker();
      else startRound();
    }).catch(showLoadError);
  }

  function showPlayerPicker() {
    app.innerHTML =
      '<h1>Who&rsquo;s playing?</h1>' +
      '<p class="subtitle">Your choice is shared with the 50 States Challenge.</p>' +
      '<div class="menu-cards">' +
        '<button type="button" class="menu-card" data-player="Luke"><div class="card-icon">🦸‍♂️</div><h2>Luke</h2><p>Start Luke&rsquo;s Pin Sprint.</p></button>' +
        '<button type="button" class="menu-card" data-player="Samantha"><div class="card-icon">🦸‍♀️</div><h2>Samantha</h2><p>Start Samantha&rsquo;s Pin Sprint.</p></button>' +
      '</div>' +
      '<a class="back-link" href="/study/archive/">&larr; Past practice</a>';
    app.querySelectorAll("[data-player]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        engine.setActiveProfile(btn.dataset.player);
        startRound();
      });
    });
  }

  function startRound() {
    advancing = false;
    solvedCodes = {};
    wrongCodes = {};
    firstTryScore = 0;
    currentIndex = 0;
    attempts = 0;
    tinyCodes = {};
    try { engine.cancelAutoAdvance(); engine.streakCount = 0; } catch (e) {}

    var data = engine.loadData();
    activeProfile = data.activeProfile;
    if (!activeProfile || !data.profiles[activeProfile]) { showPlayerPicker(); return; }
    var p = data.profiles[activeProfile];
    var n = engine.quickRoundSize ? engine.quickRoundSize(p) : 10;
    roundStates = engine.quickRoundStates(p, n).map(function(s) { return { code: s.code, name: s.name }; });
    startingMastered = {};
    (p.masteredOrder || []).forEach(function(code) { startingMastered[code] = true; });
    roundStartedAt = Date.now();
    renderQuestion();
  }

  function stateClassMap() {
    var out = {};
    Object.keys(solvedCodes).forEach(function(code) { out[code] = "pin-solved"; });
    return out;
  }

  function progressHTML(state) {
    var pct = Math.round((currentIndex / roundStates.length) * 100);
    var streak = 0;
    try { streak = engine.streakCount || 0; } catch (e) {}
    return '<div class="pin-head">' +
      '<h1>📍 Pin Sprint</h1>' +
      '<div class="pin-progress"><div style="width:' + pct + '%"></div></div>' +
      '<div class="pin-meta"><span>' + (currentIndex + 1) + ' of ' + roundStates.length + '</span><span>' +
        (streak >= 2 ? '🔥 ' + streak + ' &middot; ' : '') + firstTryScore + ' first try</span></div>' +
      '<div class="pin-prompt"><div class="label">Find</div><div class="state-name">' + esc(state.name) + '</div></div>' +
      '</div>';
  }

  function renderQuestion() {
    if (currentIndex >= roundStates.length) { finishRound(); return; }
    advancing = false;
    attempts = 0;
    wrongCodes = {};
    tinyCodes = {};
    var state = roundStates[currentIndex];
    var svg = engine.buildMapSVG({ interactive: false, showTitles: false, classMap: stateClassMap() });

    app.innerHTML =
      progressHTML(state) +
      '<div class="pin-map-wrap" id="pinMap">' + svg + '</div>' +
      '<div class="pin-feedback" id="pinFeedback" aria-live="polite"></div>' +
      '<div class="pin-tip" id="pinTip">Tap the state. A miss lets you try again.</div>';

    var wrap = document.getElementById("pinMap");
    var svgEl = wrap.querySelector("svg");
    if (!svgEl) { showLoadError(); return; }
    svgEl.setAttribute("aria-label", "Map of the United States");
    svgEl.querySelectorAll("path.state").forEach(function(path) {
      path.setAttribute("tabindex", "0");
      path.setAttribute("role", "button");
      path.setAttribute("aria-label", "State shape");
    });
    addFingerTargets(svgEl);
    wireMap(svgEl, state);
  }

  function addFingerTargets(svgEl) {
    var paths = Array.from(svgEl.querySelectorAll("path.state"));
    var ranked = paths.map(function(path) {
      try {
        var b = path.getBBox();
        return { path: path, area: b.width * b.height, code: path.dataset.code };
      } catch (e) { return { path: path, area: Infinity, code: path.dataset.code }; }
    }).sort(function(a, b) { return a.area - b.area; }).slice(0, 8);

    ranked.forEach(function(item) { tinyCodes[item.code] = true; });
    ranked.sort(function(a, b) { return b.area - a.area; }).forEach(function(item) {
      var clone = document.createElementNS("http://www.w3.org/2000/svg", "path");
      clone.setAttribute("class", "pin-hit");
      clone.setAttribute("data-code", item.code);
      clone.setAttribute("d", item.path.getAttribute("d"));
      clone.setAttribute("tabindex", "0");
      clone.setAttribute("role", "button");
      clone.setAttribute("aria-label", "Small state tap target");
      svgEl.appendChild(clone);
    });
  }

  function wireMap(svgEl, target) {
    svgEl.querySelectorAll("path.state, path.pin-hit").forEach(function(path) {
      function choose() {
        if (advancing) return;
        handleChoice(path.dataset.code, target, svgEl);
      }
      path.addEventListener("click", choose);
      path.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); }
      });
    });
  }

  function visiblePath(svgEl, code) {
    return svgEl.querySelector('path.state[data-code="' + code + '"]');
  }

  function recordFirstAttempt(target, correct) {
    var mres = { justMastered: false };
    try {
      mres = engine.recordAnswer(target.code, correct) || mres;
      engine.bumpStreak(correct);
      if (engine.celebrate) engine.celebrate(correct, !!mres.justMastered);
      if (engine.schedulePush) engine.schedulePush(0);
    } catch (e) {}
    return mres;
  }

  function handleChoice(code, target, svgEl) {
    var correct = code === target.code;
    var fb = document.getElementById("pinFeedback");
    var tip = document.getElementById("pinTip");
    var path = visiblePath(svgEl, code);

    if (correct) {
      var firstTry = attempts === 0;
      var mres = firstTry ? recordFirstAttempt(target, true) : { justMastered: false };
      if (firstTry) firstTryScore++;
      solvedCodes[target.code] = true;
      if (path) { path.classList.remove("pin-hint", "pin-wrong"); path.classList.add("pin-correct"); }
      fb.className = "pin-feedback good";
      fb.textContent = (firstTry ? "✓ " : "💪 Got it — ") + target.name + (mres.justMastered ? " — state mastered!" : "");
      tip.textContent = mres.justMastered ? "⭐ That state is now filled in on your mastery map." : "";
      advancing = true;
      setTimeout(function() { currentIndex++; renderQuestion(); }, mres.justMastered ? 950 : 560);
      return;
    }

    var firstMiss = attempts === 0;
    if (firstMiss) recordFirstAttempt(target, false);
    attempts++;
    wrongCodes[code] = true;
    if (path) path.classList.add("pin-wrong");
    var clicked = engine.byCode ? engine.byCode(code) : null;
    var clickedName = clicked ? clicked.name : "another state";
    fb.className = "pin-feedback try";

    if (attempts >= 2) {
      var targetPath = visiblePath(svgEl, target.code);
      if (targetPath) targetPath.classList.add("pin-hint");
      fb.textContent = target.name + " is highlighted — tap it to lock it in.";
      tip.textContent = "The miss counted once. Now this is just practice.";
    } else {
      fb.textContent = "That’s " + clickedName + " — try " + target.name + " again.";
      if (tinyCodes[target.code]) {
        zoomToward(svgEl, target.code);
        tip.textContent = "Zoomed in a little to help with the tiny states.";
      } else {
        tip.textContent = "Keep looking — no extra penalty for another tap.";
      }
    }
  }

  function zoomToward(svgEl, code) {
    var path = visiblePath(svgEl, code);
    if (!path) return;
    try {
      var b = path.getBBox();
      var padX = Math.max(55, b.width * 3.4);
      var padY = Math.max(42, b.height * 3.4);
      var x = b.x - padX;
      var y = b.y - padY;
      var w = b.width + padX * 2;
      var h = b.height + padY * 2;
      svgEl.setAttribute("viewBox", [x, y, w, h].join(" "));
      var note = document.createElement("div");
      note.className = "pin-zoom-note";
      note.textContent = "Zoom assist";
      var old = document.querySelector(".pin-zoom-note");
      if (old) old.remove();
      document.getElementById("pinMap").insertAdjacentElement("afterend", note);
    } catch (e) {}
  }

  function finishRound() {
    var seconds = Math.max(1, Math.round((Date.now() - roundStartedAt) / 1000));
    var data = engine.loadData();
    var p = data.profiles[activeProfile];
    var masteredNow = p && p.masteredOrder ? p.masteredOrder.length : 0;
    var newlyMastered = (p && p.masteredOrder ? p.masteredOrder : []).filter(function(code) { return !startingMastered[code]; });
    var perfect = firstTryScore === roundStates.length;
    try {
      if (perfect && engine.soundVictory) engine.soundVictory();
      if (perfect && engine.burstConfetti) engine.burstConfetti(46);
      if (engine.schedulePush) engine.schedulePush(0);
    } catch (e) {}

    var message = perfect ? "Perfect first-try sprint!" :
                  firstTryScore >= Math.ceil(roundStates.length * .7) ? "Strong run — keep the map moving." :
                  "Good practice. The states you missed were taught again before the round moved on.";
    var masteredLine = newlyMastered.length ?
      '<div class="result-message">⭐ New mastery: ' + newlyMastered.map(function(code) { var s = engine.byCode(code); return s ? esc(s.name) : code; }).join(", ") + '</div>' : '';

    app.innerHTML =
      '<h1>📍 Pin Sprint Complete</h1>' +
      '<div class="results"><div class="result-card">' +
        '<div class="score-big">' + firstTryScore + '/' + roundStates.length + '</div>' +
        '<div class="result-label">first try</div>' +
        '<div class="result-stats"><span>⏱️ ' + formatTime(seconds) + '</span><span>🗺️ ' + masteredNow + '/50 mastered</span></div>' +
        '<div class="result-message">' + message + '</div>' + masteredLine +
        '<div class="btn-row"><button type="button" class="btn btn-primary" id="again">Play another sprint</button>' +
        '<a class="btn btn-secondary" href="us-states.html">50 States menu</a></div>' +
      '</div></div>' +
      '<a class="back-link" href="/study/archive/">&larr; Past practice</a>';
    document.getElementById("again").addEventListener("click", startRound);
  }

  function formatTime(seconds) {
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m ? (m + ':' + (s < 10 ? '0' : '') + s) : (s + ' sec');
  }

  document.getElementById("startPin").addEventListener("click", begin);

  /* Expose round state for behavioural tests. Expected answers come from this
     data model, never from the visible DOM. */
  window.__pinSprintState = function() {
    return {
      activeProfile: activeProfile,
      currentIndex: currentIndex,
      firstTryScore: firstTryScore,
      attempts: attempts,
      roundStates: roundStates.map(function(s) { return { code: s.code, name: s.name }; })
    };
  };
})();
</script>
</body>
</html>
