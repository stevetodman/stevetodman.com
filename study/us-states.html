<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="50 States Challenge — learn to spell every U.S. state and find it on the map, then take the full graded test.">
<title>50 States Challenge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
<!-- Add to Home Screen: iOS needs a real PNG here (it ignores data: URIs and SVG). -->
<link rel="apple-touch-icon" href="icons/us-states-180.png">
<link rel="manifest" href="us-states.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="50 States">
<meta name="theme-color" content="#667eea">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8;
    color: #2d3748;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    /* Launched from the iPhone home screen the page runs full-screen, so the
       notch and home indicator would otherwise sit on top of the content. */
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  main { min-width: 0; }
  .container { max-width: 720px; width: 100%; }
  h1 { text-align: center; font-size: 1.7rem; margin-bottom: 6px; color: #1a365d; }
  .subtitle { text-align: center; color: #5a6678; font-size: 0.95rem; margin-bottom: 24px; }
  .back-link { display: block; text-align: center; color: #4c3fbf; font-size: 0.9rem; margin-top: 20px; text-decoration: none; }

  /* Menu */
  .menu-cards { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .menu-card { appearance: none; font: inherit; text-align: left; width: 100%; color: inherit;
    background: #fff; border-radius: 14px; padding: 22px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    cursor: pointer; border: 2px solid transparent; transition: all 0.15s ease;
  }
  .menu-card:hover { border-color: #667eea; transform: translateY(-2px); box-shadow: 0 4px 18px rgba(0,0,0,0.12); }
  .menu-card .card-icon { font-size: 1.8rem; margin-bottom: 6px; }
  .menu-card h2 { font-size: 1.15rem; color: #1a365d; margin-bottom: 4px; }
  .menu-card p { font-size: 0.9rem; color: #5a6678; line-height: 1.4; }
  .menu-card .badge { display: inline-block; background: #5b4fd1; color: #fff; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .menu-card:focus-visible, .state-chip:focus-visible, .map-controls button:focus-visible,
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #667eea; outline-offset: 2px; }

  /* Map */
  .map-wrap { background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: auto; margin-bottom: 16px; touch-action: pan-x pan-y; }
  .map-wrap.zoomed svg { width: 200%; max-width: none; }
  svg.usmap { width: 100%; height: auto; display: block; }
  path.state { fill: #cbd5e0; stroke: #fff; stroke-width: 1.2; transition: fill 0.15s ease; }
  path.state.interactive { cursor: pointer; stroke-width: 2.2; }
  path.state.interactive:hover { fill: #a3bffa; }
  path.state.target { fill: #f6ad55; }
  path.state.picked { fill: #667eea; }
  path.state.correct { fill: #48bb78; }
  path.state.wrong { fill: #f56565; }
  path.state.reveal { fill: #f6ad55; }
  .inset-label { text-align: center; font-size: 0.85rem; font-weight: 600; color: #5a6678; margin-bottom: 8px; }
  .map-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
  .map-controls button { padding: 8px 16px; font-size: 0.85rem; font-weight: 600; border: 2px solid #e2e8f0; border-radius: 999px; background: #fff; color: #4a5568; cursor: pointer; }
  .map-controls button:hover { border-color: #667eea; color: #667eea; }
  .map-controls button.active { background: #667eea; border-color: #667eea; color: #fff; }

  /* Prompt / question card */
  .prompt-card { background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; text-align: center; }
  .prompt-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #a0aec0; margin-bottom: 6px; }
  .prompt-text { font-size: 1.4rem; font-weight: 700; color: #1a365d; }
  .prompt-hint { font-size: 0.85rem; color: #5a6678; margin-top: 6px; }

  .progress-bar { background: #e2e8f0; border-radius: 999px; height: 10px; margin-bottom: 10px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .score-line { display: flex; justify-content: space-between; font-size: 0.9rem; color: #4a5568; margin-bottom: 16px; }

  .spell-form { display: flex; gap: 10px; margin-top: 16px; }
  .spell-form input {
    flex: 1; min-width: 0; padding: 14px 16px; font-size: 1.1rem; border: 2px solid #e2e8f0; border-radius: 12px;
    color: #2d3748; text-align: center;
  }
  .spell-form input:focus { outline: none; border-color: #667eea; }
  .spell-form button {
    padding: 14px 22px; font-size: 1rem; font-weight: 600; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; cursor: pointer;
  }
  .spell-form button:hover { opacity: 0.9; }

  .feedback { text-align: center; font-size: 1.1rem; font-weight: 600; margin: 14px 0; min-height: 28px; }
  .feedback.correct-fb { color: #38a169; }
  .feedback.wrong-fb { color: #e53e3e; }
  .next-btn {
    display: block; margin: 8px auto 0; padding: 12px 32px; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 10px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; cursor: pointer;
  }
  .next-btn:hover { opacity: 0.9; }

  /* Explore */
  .state-info-card { background: #fff; border-radius: 16px; padding: 20px 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; text-align: center; }
  .state-info-card .state-name { font-size: 1.5rem; font-weight: 700; color: #1a365d; margin-bottom: 4px; }
  .state-info-card .state-spell { font-size: 1.1rem; letter-spacing: 0.12em; color: #667eea; font-weight: 600; }
  .state-info-card .state-placeholder { color: #a0aec0; font-size: 0.95rem; }
  .state-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .state-chip {
    padding: 6px 12px; font-size: 0.85rem; border-radius: 999px; border: 2px solid #e2e8f0;
    background: #fff; color: #4a5568; cursor: pointer;
  }
  .state-chip:hover, .state-chip.active { border-color: #667eea; color: #667eea; background: #f7f8ff; }

  /* Results */
  .results { text-align: center; }
  .results .score-big { font-size: 3.2rem; font-weight: 700; color: #667eea; margin: 12px 0 2px; }
  .results .score-label { font-size: 1.05rem; color: #5a6678; margin-bottom: 6px; }
  .results .grade { font-size: 1.3rem; font-weight: 700; margin-bottom: 18px; }
  .results .sub-scores { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; font-size: 0.95rem; color: #4a5568; }
  .missed-list { text-align: left; margin: 0 auto 24px; max-width: 500px; }
  .missed-list h3 { font-size: 1rem; color: #e53e3e; margin-bottom: 10px; }
  .missed-item { padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
  .missed-item .mi-name { color: #2d3748; font-weight: 600; }
  .missed-item .mi-type { color: #a0aec0; font-size: 0.78rem; text-transform: uppercase; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .btn-row button { padding: 12px 28px; font-size: 1rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
  .btn-row button:hover { opacity: 0.85; }
  .btn-retry-missed { background: #e53e3e; color: #fff; }
  .btn-restart { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .btn-home { background: #4a5568; color: #fff; }

  /* Player strip / profiles */
  .player-strip { text-align: center; font-size: 0.85rem; color: #5a6678; margin-bottom: 10px; }
  .switch-link { background: none; border: none; padding: 0; font: inherit; color: #667eea; text-decoration: underline; cursor: pointer; }
  .profile-pick .card-icon { font-size: 2.2rem; }

  /* Avatar picker */
  .avatar-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
  .avatar-option {
    width: 64px; height: 64px; font-size: 1.9rem; line-height: 1; border-radius: 16px;
    border: 2px solid #e2e8f0; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .avatar-option:hover { border-color: #667eea; background: #f7f8ff; }
  .avatar-option.current { border-color: #667eea; background: #eef0ff; box-shadow: 0 0 0 2px #667eea inset; }

  /* Sync code */
  .sync-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.95rem;
    background: #f7f8ff; border: 2px dashed #667eea; border-radius: 10px; padding: 14px 16px;
    word-break: break-all; margin-bottom: 14px; color: #4c3fbf; cursor: text; user-select: all;
  }

  /* Road trip */
  path.state.mastered { fill: #48bb78; }
  .road-trip-card { background: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 18px; }
  .road-trip-header { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; color: #1a365d; margin-bottom: 8px; font-size: 0.95rem; }
  .road-trip-card .map-wrap { margin-bottom: 8px; padding: 6px; }
  .road-trip-card .map-wrap svg { max-height: 200px; }
  .road-trip-note { text-align: center; font-size: 0.85rem; color: #5a6678; }

  /* Trophy case */
  .trophy-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .trophy-card { background: #fff; border-radius: 16px; padding: 20px 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); min-width: 190px; text-align: center; border: 2px solid transparent; }
  .trophy-card.active-player { border-color: #667eea; }
  .trophy-name { font-size: 1.15rem; font-weight: 700; color: #1a365d; margin-bottom: 10px; }
  .you-tag { display: inline-block; background: #667eea; color: #fff; font-size: 0.68rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-left: 4px; vertical-align: middle; }
  .trophy-stat { font-size: 0.9rem; color: #4a5568; margin: 6px 0; }
  .trophy-num { font-size: 1.25rem; font-weight: 700; color: #667eea; margin-right: 4px; }

  /* Boss battles */
  .boss-banner { background: linear-gradient(135deg, #744210, #c05621); color: #fff; border-radius: 16px; padding: 18px 22px; text-align: center; margin-bottom: 16px; }
  .boss-name { font-size: 1.3rem; font-weight: 700; }
  .hp-bar { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .hp-pip { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .hp-pip.full { background: #fc8181; box-shadow: 0 0 0 2px rgba(255,255,255,0.5) inset; }

  /* Confetti (mastery celebration) */
  #confetti {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50;
  }
  .confetti-bit {
    position: absolute; width: 10px; height: 14px; border-radius: 2px; will-change: transform, opacity;
    animation: confetti-fall 1400ms cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti-bit { animation-duration: 1ms; opacity: 0; }
  }

  .fact-line {
    margin: 8px auto 0; max-width: 460px; background: #fffaf0; border: 1px solid #f6e0b8;
    border-radius: 10px; padding: 8px 12px; font-size: 0.88rem; color: #7a5320; line-height: 1.4;
  }
  .cloud-status { font-size: 0.78rem; color: #718096; margin-top: 2px; min-height: 14px; }
  .best-line { text-align: center; font-size: 0.85rem; color: #5a6678; margin-top: 6px; }
  .new-best { color: #b04a12; font-weight: 700; }

  /* Quick Round / resume cards */
  .badge-quick { background: #b04a12; }
  .badge-resume { background: #2c7a7b; }

  /* Fat invisible tap targets for the states too small to hit with a fingertip.
     Rendered on top of the visible map, smallest last so the tiniest state wins
     where neighbours overlap. */
  path.state-hit { fill: transparent; stroke: transparent; stroke-width: 7; stroke-linejoin: round; cursor: pointer; }

  /* Immediate touch feedback: :active is unreliable on SVG in iOS Safari, so a
     class is toggled from touchstart instead. */
  path.state.pressed { fill: #7f9cf5; }

  path.state.pop { animation: state-pop 420ms ease-out; }
  path.state.shake { animation: state-shake 380ms ease-in-out; }
  @keyframes state-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  @keyframes state-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    45% { transform: translateX(3px); }
    70% { transform: translateX(-2px); }
  }
  /* Scale/translate an SVG path about its own centre rather than the origin. */
  path.state.pop, path.state.shake { transform-box: fill-box; transform-origin: center; }

  .streak-pill { font-weight: 700; color: #b04a12; }
  .mastery-pips { text-align: center; font-size: 0.9rem; color: #5a6678; margin-top: 2px; min-height: 20px; }
  .mastery-pips strong { color: #b04a12; }

  @media (prefers-reduced-motion: reduce) {
    path.state.pop, path.state.shake { animation: none; }
  }

  /* Thumb zone: on a phone the advance control sits at the bottom of the
     screen instead of wherever the page happens to have scrolled to. */
  @media (max-width: 640px) {
    body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .next-btn.thumb {
      position: fixed; left: 12px; right: 12px; width: auto; margin: 0;
      bottom: calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 6px 20px rgba(0,0,0,0.22); z-index: 40; padding: 16px 22px;
    }
  }
</style>
</head>

/* ── HELPERS ── */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function byCode(code) {
  for (var i = 0; i < STATES.length; i++) { if (STATES[i].code === code) return STATES[i]; }
  return null;
}
function normalize(s) {
  return String(s).trim().toLowerCase().replace(/\s+/g, " ");
}

/* ── SOUND ──
   iOS Safari will not start an AudioContext outside a user gesture and
   suspends it when the page is backgrounded, so the context is created on the
   first tap and resumed before every sound. (Haptics are deliberately absent:
   Safari on iOS does not support the Vibration API, so feedback is audio and
   motion only.) */
var SOUND_KEY = "usStatesSound";
var audioCtx = null;
var soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) {}

function setSoundOn(on) {
  soundOn = on;
  try { localStorage.setItem(SOUND_KEY, on ? "on" : "off"); } catch (e) {}
}
function unlockAudio() {
  if (audioCtx) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { audioCtx = new Ctx(); } catch (e) { audioCtx = null; }
}
document.addEventListener("touchstart", unlockAudio, { once: true, passive: true });
document.addEventListener("mousedown", unlockAudio, { once: true });

/* notes: [{f: hz, t: startSeconds, d: durationSeconds}] */
function playNotes(notes, type, peak) {
  if (!soundOn) return;
  unlockAudio();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
  var now = audioCtx.currentTime;
  notes.forEach(function(n) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(n.f, now + n.t);
    // Short attack/decay envelope; a raw gate would click.
    gain.gain.setValueAtTime(0.0001, now + n.t);
    gain.gain.exponentialRampToValueAtTime(peak || 0.18, now + n.t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + n.t);
    osc.stop(now + n.t + n.d + 0.02);
  });
}
function soundCorrect() {
  playNotes([{ f: 587.33, t: 0, d: 0.11 }, { f: 880, t: 0.09, d: 0.16 }], "sine");
}
function soundWrong() {

/* ── CONFETTI ── */
var CONFETTI_COLORS = ["#667eea", "#764ba2", "#48bb78", "#f6ad55", "#fc8181", "#38b2ac"];
function burstConfetti(count) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var layer = document.getElementById("confetti");
  if (!layer) {
    layer = document.createElement("div");
    layer.id = "confetti";
    document.body.appendChild(layer);
  }
  var n = count || 28;
  for (var i = 0; i < n; i++) {
    var bit = document.createElement("div");
    bit.className = "confetti-bit";
    bit.style.left = (10 + Math.random() * 80) + "%";
    bit.style.top = (-8 - Math.random() * 12) + "%";
    bit.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    bit.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    bit.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    bit.style.animationDelay = (Math.random() * 180) + "ms";
    layer.appendChild(bit);
    (function(el) { setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 1900); })(bit);
  }
}
/* Fired whenever an answer resolves, so every mode gets the same feedback. */
function celebrate(correct, justMastered) {
  if (justMastered) { soundMastery(); burstConfetti(30); }
  else if (correct) soundCorrect();
  else soundWrong();
}

  });
  Object.keys(payload.w || {}).forEach(function(c) {
    if (!p.stateStats[c]) p.stateStats[c] = { streak: 0, correct: 0, wrong: 0, mastered: false };
    p.stateStats[c].wrong = payload.w[c];
  });
  Object.keys(payload.s || {}).forEach(function(c) {
    if (!p.stateStats[c]) p.stateStats[c] = { streak: 0, correct: 0, wrong: 0, mastered: false };
    p.stateStats[c].streak = payload.s[c];
  });
  return { name: payload.n, profile: p };
}
function mergeProfiles(a, b) {
  var out = emptyProfile();
  var allCodes = {};
  Object.keys(a.stateStats).forEach(function(c) { allCodes[c] = 1; });
  Object.keys(b.stateStats).forEach(function(c) { allCodes[c] = 1; });
  Object.keys(allCodes).forEach(function(c) {
    var sa = a.stateStats[c] || { streak: 0, correct: 0, wrong: 0, mastered: false };
    var sb = b.stateStats[c] || { streak: 0, correct: 0, wrong: 0, mastered: false };
    out.stateStats[c] = {
      streak: Math.max(sa.streak, sb.streak),
      correct: Math.max(sa.correct, sb.correct),
      wrong: Math.max(sa.wrong, sb.wrong),
      mastered: sa.mastered || sb.mastered
    };
  });
  var seen = {};
  a.masteredOrder.concat(b.masteredOrder).forEach(function(c) {
    if (out.stateStats[c] && out.stateStats[c].mastered && !seen[c]) { seen[c] = true; out.masteredOrder.push(c); }
  });
  var wk = currentWeekKey();
  var aw = a.weekKey === wk ? (a.weekMastered || 0) : 0;
  var bw = b.weekKey === wk ? (b.weekMastered || 0) : 0;
  out.weekKey = wk;
  out.weekMastered = Math.max(aw, bw);
  out.bossesDefeated = Math.max(a.bossesDefeated || 0, b.bossesDefeated || 0);
  out.avatar = a.avatar || b.avatar || null;
  /* An in-progress round is device-local (it is not in the sync code at all),
     so keep whatever this device already had rather than dropping it. */
  out.round = a.round || null;
  return out;
}

/* ── MAP BUILDER ── */
/* opts: { interactive:bool, showTitles:bool, targetCode:str, classMap:{code:className}, viewBox:str } */
function buildMapSVG(opts) {
  opts = opts || {};
  var classMap = opts.classMap || {};
  var viewBox = opts.viewBox || (MAP_VIEWBOX.x + " " + MAP_VIEWBOX.y + " " + MAP_VIEWBOX.w + " " + MAP_VIEWBOX.h);
  var parts = [];
  parts.push('<svg class="usmap" viewBox="' + viewBox + '" xmlns="http://www.w3.org/2000/svg">');
  for (var i = 0; i < STATES.length; i++) {
    var s = STATES[i];
    var cls = "state";
    if (opts.interactive) cls += " interactive";
    if (opts.targetCode === s.code) cls += " target";
    if (classMap[s.code]) cls += " " + classMap[s.code];
    var title = opts.showTitles ? ("<title>" + esc(s.name) + "</title>") : "";
    parts.push('<path class="' + cls + '" data-code="' + s.code + '" d="' + s.d + '">' + title + '</path>');
  }
  /* Fingertip targets for the smallest states, painted last so they sit above
     the map. Ordered largest-first so the smallest state ends up topmost and
     wins where two tiny neighbours' targets overlap. */
  if (opts.interactive) {
    smallStatesBySizeDesc().forEach(function(code) {
      var st = byCode(code);
      if (st) parts.push('<path class="state-hit" data-code="' + code + '" d="' + st.d + '"></path>');
    });
  }
  parts.push('</svg>');
  return parts.join("");
}

function mapWrapHTML(svgHTML, id) {
  return '<div class="map-wrap" id="' + id + '">' + svgHTML + '</div>';
}

/* ── SMALL-STATE ZOOM (data-driven, not a hardcoded region list) ──
   "Small on the map" isn't the same as "small bounding box" — a diagonal
   or spread-out shape (like Hawaii's islands) can have a huge bounding box
   around mostly empty space, and a compact, boxy state (like Ohio) can have
   a bounding box close to its true size. What actually determines whether a
   state is hard to tap is its FILLED pixel area, so that's rasterized on an
   offscreen canvas rather than approximated from getBBox(). getBBox() is
   still used separately to frame a tight zoom viewport once a state is
   known to be small. */
var MAP_VIEWBOX = { x: 174, y: 100, w: 959, h: 593 };
var STATE_BBOX = null;
var SMALL_STATE_CODES = null;
var SMALL_STATE_ORDER = null;
var SMALL_STATE_COUNT = 15;
/* Enlarged tap targets are deliberately given to a smaller set than the zoom
   inset. A fat target steals area from its neighbours, so it is worth it only
   for the very smallest states: measured across the northeast, covering the
   smallest 8 at this stroke width keeps Rhode Island's full reach while
   leaving Massachusetts and Pennsylvania far more of their own area than
   covering all 15 did. */
var HIT_TARGET_COUNT = 8;
function ensureStateBBoxes() {
  if (STATE_BBOX) return;
  STATE_BBOX = {};
  var holder = document.createElement("div");
  holder.style.cssText = "position:absolute; left:-9999px; top:-9999px; width:0; height:0; overflow:hidden;";
  holder.innerHTML = buildMapSVG({ interactive: false, showTitles: false });
  document.body.appendChild(holder);
  var svgNS = "http://www.w3.org/2000/svg";
  holder.querySelectorAll("path.state").forEach(function(p) {
    try {
      /* A state whose shape is several disconnected pieces (e.g. Hawaii's
         islands) has a bbox spanning the open water between them, which
         would zoom out to fit the whole spread instead of in on any one
         island. Frame on the single largest connected piece instead —
         still correct to tap anywhere in the state, since answers are
         checked by state code, not by which piece was clicked. */
      var subpaths = p.getAttribute("d").split(/(?=[Mm])/).map(function(d) { return d.trim(); }).filter(Boolean);
      var box;
      if (subpaths.length <= 1) {
        box = p.getBBox();
      } else {
        var best = null;
        subpaths.forEach(function(d) {
          var tmp = document.createElementNS(svgNS, "path");
          tmp.setAttribute("d", d);
          p.parentNode.appendChild(tmp);
          var b = tmp.getBBox();
          if (!best || b.width * b.height > best.width * best.height) best = b;
          tmp.parentNode.removeChild(tmp);
        });
        box = best;
      }
      STATE_BBOX[p.dataset.code] = { x: box.x, y: box.y, width: box.width, height: box.height };
    } catch (e) {}
  });
  document.body.removeChild(holder);

  var scale = 0.5;
  var canvas = document.createElement("canvas");
  canvas.width = Math.round(MAP_VIEWBOX.w * scale);
  canvas.height = Math.round(MAP_VIEWBOX.h * scale);
  var ctx = canvas.getContext("2d");
  var areas = {};
  for (var i = 0; i < STATES.length; i++) {
    var s = STATES[i];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, -MAP_VIEWBOX.x * scale, -MAP_VIEWBOX.y * scale);
    ctx.fillStyle = "#000";
    ctx.fill(new Path2D(s.d));
    var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    var count = 0;
    for (var px = 3; px < data.length; px += 4) { if (data[px] > 0) count++; }
    areas[s.code] = count;
  }
  var entries = Object.keys(areas).map(function(c) { return { code: c, area: areas[c] }; });
  entries.sort(function(a, b) { return a.area - b.area; });
  SMALL_STATE_CODES = {};
  SMALL_STATE_ORDER = [];
  entries.slice(0, SMALL_STATE_COUNT).forEach(function(e) { SMALL_STATE_CODES[e.code] = true; });
  // Largest of the small states first: painted in this order, the smallest
  // ends up on top and wins any overlap between neighbouring tap targets.
  SMALL_STATE_ORDER = entries.slice(0, SMALL_STATE_COUNT).map(function(e) { return e.code; }).reverse();
}
function isSmallState(code) {
  ensureStateBBoxes();
  return !!SMALL_STATE_CODES[code];
}
function smallStatesBySizeDesc() {
  ensureStateBBoxes();
  var order = SMALL_STATE_ORDER || [];
  return order.slice(Math.max(0, order.length - HIT_TARGET_COUNT));  // the smallest N, largest of them first
}
/* A tight viewBox centered on one state, padded generously so its
   neighbors stay visible for orientation, with a floor so an ultra-tiny
   state (Rhode Island) doesn't get an unreadably small viewport. */
function zoomViewBoxFor(code) {
  ensureStateBBoxes();
  var box = STATE_BBOX[code];
  if (!box) return null;
  var MIN_DIM = 70;
  var padX = Math.max(box.width * 0.9, 10);
  var padY = Math.max(box.height * 0.9, 10);
  var w = Math.max(box.width + padX * 2, MIN_DIM);
  var h = Math.max(box.height + padY * 2, MIN_DIM);
  padX = (w - box.width) / 2;
  padY = (h - box.height) / 2;
  return (box.x - padX) + " " + (box.y - padY) + " " + w + " " + h;
}

function buildRoadTripSVG(p) {
  var classMap = {};
  for (var i = 0; i < STATES.length; i++) {
    var st = p.stateStats[STATES[i].code];
    if (st && st.mastered) classMap[STATES[i].code] = "mastered";
  }
  return buildMapSVG({ interactive: false, showTitles: false, classMap: classMap });
}

    saveData(d);
    fb.className = "feedback correct-fb";
    fb.textContent = "Synced! Loading " + esc(decoded.name) + "'s progress…";
    setTimeout(showMenu, 800);
  });

  document.getElementById("toMenu").addEventListener("click", showMenu);
}

/* ── BOSS BATTLES ── */
var bossQueue = [];
function startBossBattle() {
  cancelAutoAdvance();
  streakCount = 0;
  var data = loadData();
  var p = data.profiles[data.activeProfile];
  var bosses = getBossStates(p);
  if (bosses.length === 0) {
    app.innerHTML =
      '<h1>👑 Boss Battles</h1>' +
      '<div class="prompt-card"><p>No bosses yet! Bosses show up when you miss a state a couple of times in Spelling or Map Practice. Go practice, then come back to battle your toughest states.</p></div>' +
      '<div class="btn-row"><button class="btn-home" id="toMenu">Back to Menu</button></div>';
    document.getElementById("toMenu").addEventListener("click", showMenu);
    return;
  }
  bossQueue = bosses.map(function(s) { return { code: s.code, name: s.name, hp: BOSS_HP }; });
  renderBossQuestion();
}

function renderBossQuestion() {
  var alive = bossQueue.filter(function(b) { return b.hp > 0; });
  if (alive.length === 0) { renderBossResults(); return; }
  var boss = alive[Math.floor(Math.random() * alive.length)];
  var s = byCode(boss.code);
  var svg = buildMapSVG({ interactive: false, showTitles: false, targetCode: s.code });
  var hpDots = "";
  for (var i = 0; i < BOSS_HP; i++) hpDots += '<span class="hp-pip' + (i < boss.hp ? ' full' : '') + '"></span>';

  app.innerHTML =
    '<h1>👑 Boss Battle</h1>' +
    '<div class="boss-banner">' +
      // The name must NOT appear here: this is a spelling question, and the
      // banner used to print the answer directly above the input box.
      '<div class="boss-name" id="bossName">👑 Boss State</div>' +
      '<div class="hp-bar">' + hpDots + '</div>' +
    '</div>' +
    mapWrapHTML(svg, "bossMap") +
    '<div class="prompt-card">' +
      '<div class="prompt-label">Spell the highlighted state to attack!</div>' +
      '<form class="spell-form" id="bossForm" autocomplete="off">' +
        '<input type="text" id="bossInput" aria-label="Type the state name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Spell it here...">' +
        '<button type="submit">Attack!</button>' +
      '</form>' +
    '</div>' +
    '<div class="feedback" id="feedback"></div>';

  var input = document.getElementById("bossInput");
  input.focus();
  var answered = false;

  document.getElementById("bossForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (answered) return;
    answered = true;
    var correct = normalize(input.value) === normalize(s.name);
    input.disabled = true;
    var fb = document.getElementById("feedback");
    var mres = recordAnswer(s.code, correct);
    bumpStreak(correct);
    celebrate(correct, mres.justMastered);
    animateState("bossMap", s.code, correct);
    var nameEl = document.getElementById("bossName");
    if (nameEl) nameEl.textContent = "👑 " + s.name;   // revealed only after answering
    if (correct) {
      boss.hp--;
      if (boss.hp <= 0) {
        defeatBoss(boss.code);
        fb.className = "feedback correct-fb";
        fb.textContent = "💥 Direct hit! " + s.name + " is defeated!" + (mres.justMastered ? " 🌟 Mastered too!" : "");
      } else {
        fb.className = "feedback correct-fb";
        fb.textContent = "💥 Hit! " + boss.hp + " HP left." + (mres.justMastered ? " 🌟 State mastered!" : "");
      }
    } else {
      fb.className = "feedback wrong-fb";
      fb.textContent = "Missed! It's spelled: " + s.name;
    }
    if (boss.hp <= 0 && correct) burstConfetti(38);

    var next = makeNextButton("Continue →", renderBossQuestion);
    fb.parentNode.insertBefore(next.el, fb.nextSibling);
    if (correct) scheduleAutoAdvance(next.go, advanceDelayFor(lastFactShown));
  });
}

function renderBossResults() {
  var count = bossQueue.length;
  app.innerHTML =
    '<h1>👑 Boss Battles Complete!</h1>' +
    '<div class="prompt-card results">' +
      '<div class="score-big">🏆</div>' +
      '<div class="message">You defeated all ' + count + ' boss state' + (count === 1 ? "" : "s") + '! They won&rsquo;t give you trouble again &mdash; for now.</div>' +
    '</div>' +
    '<div class="btn-row"><button class="btn-home" id="toMenu">Back to Menu</button></div>';
  document.getElementById("toMenu").addEventListener("click", showMenu);
}

/* ── EXPLORE MODE ── */
var exploreSelected = null;
function showExplore() {
  var svg = buildMapSVG({ interactive: true, showTitles: false });
  var listHTML = STATES.map(function(s) {
    return '<button class="state-chip" data-code="' + s.code + '">' + esc(s.name) + '</button>';
  }).join("");

  app.innerHTML =
    '<h1>🔎 Explore the Map</h1>' +
    '<p class="subtitle">Click a state on the map, or pick a name below</p>' +
    zoomControlsHTML() +
    mapWrapHTML(svg, "exploreMap") +
    '<div class="state-info-card" id="exploreInfo">' +
      '<p class="state-placeholder">Click a state to see its name and spelling</p>' +
    '</div>' +
    '<div class="state-info-card"><div class="state-list">' + listHTML + '</div></div>' +
    '<div class="btn-row"><button class="btn-home" id="toMenu">Back to Menu</button></div>';

  wireZoomToggle("exploreMap");

  function selectState(code) {
    exploreSelected = code;
    var s = byCode(code);
    document.querySelectorAll("#exploreMap path.state").forEach(function(p) {
      p.classList.toggle("picked", p.dataset.code === code);
    });
    document.querySelectorAll(".state-chip").forEach(function(c) {
      c.classList.toggle("active", c.dataset.code === code);
    });
    document.getElementById("exploreInfo").innerHTML =
      '<div class="state-name">' + esc(s.name) + '</div>' +
      '<div class="state-spell">' + esc(s.name.toUpperCase().split("").join(" ")) + '</div>';
  }

  wireTouchFeedback("exploreMap");
  document.getElementById("exploreMap").querySelectorAll("path.state, path.state-hit").forEach(function(p) {
    p.addEventListener("click", function() { selectState(p.dataset.code); });
  });
  document.querySelectorAll(".state-chip").forEach(function(c) {
    c.addEventListener("click", function() { selectState(c.dataset.code); });
  });
  document.getElementById("toMenu").addEventListener("click", showMenu);
}

/* ── SPELL / MAP PRACTICE (shared queue engine) ── */
function startQueue(m, pool, label) {
  cancelAutoAdvance();
  streakCount = 0;
  mode = m;
  roundLabel = label || "";
  queue = shuffle(pool);
  qIndex = 0;
  score = 0;
  missed = [];
  retriedThisRound = {};
  subScore = { spell: 0, spellTotal: 0, map: 0, mapTotal: 0 };
  renderQueueQuestion();
}

/* 10 questions, mixed spelling and map, aimed at this profile's weak states. */
function startQuickRound(size) {
  cancelAutoAdvance();
  streakCount = 0;
  var data = loadData();
  var p = data.profiles[data.activeProfile];
  var n = size || quickRoundSize(p);
  var picks = quickRoundStates(p, n);
  mode = "test";
  roundLabel = "Quick Round";
  /* Question types are shuffled, but the state order is not: quickRoundStates
     deliberately puts a state they know first so the round opens on a win. */
  var types = shuffle(picks.map(function(_, i) { return i % 2 === 0 ? "spell" : "map"; }));
  queue = picks.map(function(s, i) {
    return { code: s.code, name: s.name, type: types[i] };
  });
  qIndex = 0;
  score = 0;
  subScore = { spell: 0, spellTotal: 0, map: 0, mapTotal: 0 };
  missed = [];
  retriedThisRound = {};
  renderTestQuestion();
}

/* Both question renderers are shared by the practice queue and the graded
   test, so advancing has to return to whichever flow started the round.
   Routing every "Next" through the queue flow made a graded test silently
   become map-only practice after its first question, with no subscores and
   no grade at the end. */
function advanceQuestion() {
  if (mode === "test") renderTestQuestion();
  else renderQueueQuestion();
}

function renderQueueQuestion() {
  if (qIndex >= queue.length) { clearRound(); renderQueueResults(); return; }
  saveRound(snapshotRound());
  var item = queue[qIndex];
  if (mode === "spell") renderSpellQuestion(item, afterQueueAnswer);
  else renderMapQuestion(item, afterQueueAnswer);
}

/* Near-miss recovery: a state they just missed comes back a few questions
   later in the same round. Getting it the second time turns a failure into a
   success while it is still fresh, which is both better practice and much
   better for morale than only seeing it again in the "review these" list. */
function queueRetry(item) {
  if (retriedThisRound[item.code]) return;      // at most one retry per state per round
  retriedThisRound[item.code] = true;
  var at = Math.min(queue.length, qIndex + 3 + Math.floor(Math.random() * 2));
  queue.splice(at, 0, { code: item.code, name: item.name, type: item.type, retry: true });
}

function afterQueueAnswer(correct, item) {
  if (correct) score++;
  else { missed.push(item); queueRetry(item); }
}

function renderQueueResults() {
  var total = queue.length;
  if (score === total && total > 0) { soundVictory(); burstConfetti(46); }
  var newBest = recordBestRound(score, total);
  renderResultsScreen({
    title: mode === "spell" ? "Spelling Results" : "Map Results",
    newBest: newBest,
    score: score,
    total: total,
    missed: missed,
    onRetryMissed: function() {
      if (missed.length === 0) return;
      startQueue(mode, missed.map(function(m){ return {code:m.code, name:m.name, type:mode}; }), roundLabel);
    },
    onRestart: function() {
      var pool = STATES.map(function(s){ return {code:s.code, name:s.name, type:mode}; });
      startQueue(mode, pool);
    }
  });
}

/* renders one spelling question; calls onDone(correct, item) then advances */
function renderSpellQuestion(item, onDone) {
  var s = byCode(item.code);
  var svg = buildMapSVG({ interactive: false, showTitles: false, targetCode: s.code });
  var pct = Math.round((qIndex / queue.length) * 100);

  app.innerHTML =
    '<h1>' + (roundLabel ? '⚡ ' + esc(roundLabel) : '✏️ Spelling Practice') + '</h1>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="score-line"><span>Question ' + (qIndex + 1) + ' of ' + queue.length + '</span><span>' + streakHTML() + ' Score: ' + score + '</span></div>' +
    mapWrapHTML(svg, "qMap") +
    '<div class="prompt-card">' +
      '<div class="prompt-label">Type the name of the highlighted state</div>' +
      '<form class="spell-form" id="spellForm" autocomplete="off">' +
        '<input type="text" id="spellInput" aria-label="Type the state name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Spell it here...">' +
        '<button type="submit">Check</button>' +
      '</form>' +
    '</div>' +
    '<div class="feedback" id="feedback"></div>' +
    '<div class="mastery-pips" id="masteryPips"></div>';

  var input = document.getElementById("spellInput");
  input.focus();
  var answered = false;

  document.getElementById("spellForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (answered) return;
    answered = true;
    var correct = normalize(input.value) === normalize(s.name);
    input.disabled = true;
    var fb = document.getElementById("feedback");
    var pathEl = document.querySelector('#qMap path.state[data-code="' + s.code + '"]');
    var mres = recordAnswer(s.code, correct);
    bumpStreak(correct);
    celebrate(correct, mres.justMastered);
    animateState("qMap", s.code, correct);
    if (correct) {
      fb.className = "feedback correct-fb";
      fb.textContent = (item.retry ? "💪 Got it this time! " : "✓ Correct! ") + s.name +
                       (mres.justMastered ? " — 🌟 State mastered!" : "");
      if (pathEl) pathEl.classList.add("correct");
    } else {
      fb.className = "feedback wrong-fb";
      fb.textContent = kindMiss() + " It's spelled: " + s.name;
      if (pathEl) pathEl.classList.add("wrong");
    }
    document.getElementById("masteryPips").innerHTML =
      masteryPipsHTML(s.code, mres.justMastered) + (correct ? factLineHTML(s.code) : "");

    var next = makeNextButton(qIndex + 1 >= queue.length ? "See Results" : "Next →", function() {
      qIndex++;
      onDone(correct, item);
      advanceQuestion();
    });
    fb.parentNode.insertBefore(next.el, fb.nextSibling);
    if (correct) scheduleAutoAdvance(next.go);
  });
}

/* renders one map-click question; calls onDone(correct, item) then advances */
function renderMapQuestion(item, onDone) {
  var s = byCode(item.code);
  var svg = buildMapSVG({ interactive: true, showTitles: false });
  var pct = Math.round((qIndex / queue.length) * 100);
  var small = isSmallState(s.code);
  var insetSVG = small ? buildMapSVG({ interactive: true, showTitles: false, viewBox: zoomViewBoxFor(s.code) }) : "";

  app.innerHTML =
    '<h1>' + (roundLabel ? '⚡ ' + esc(roundLabel) : '📍 Map Practice') + '</h1>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="score-line"><span>Question ' + (qIndex + 1) + ' of ' + queue.length + '</span><span>' + streakHTML() + ' Score: ' + score + '</span></div>' +
    '<div class="prompt-card">' +
      '<div class="prompt-label">Click on the map</div>' +
      '<div class="prompt-text">' + esc(s.name) + '</div>' +
      (small ? '<div class="prompt-hint">This state is tiny, so we zoomed in below &mdash; tap it there!</div>' : '') +
    '</div>' +
    (small ? ('<div class="inset-label">Zoomed in</div>' + mapWrapHTML(insetSVG, "qMapInset")) : '') +
    (small ? '' : zoomControlsHTML()) +
    (small ? '<div class="inset-label">Whole country (for reference)</div>' : '') +
    mapWrapHTML(svg, "qMap") +
    '<div class="feedback" id="feedback"></div>' +
    '<div class="mastery-pips" id="masteryPips"></div>';

  if (!small) wireZoomToggle("qMap");

  var answered = false;
  var mapIds = small ? ["qMapInset", "qMap"] : ["qMap"];
  mapIds.forEach(function(mapId) {
    wireTouchFeedback(mapId);
    // Both the visible state and its enlarged fingertip target answer the question.
    document.getElementById(mapId).querySelectorAll("path.state, path.state-hit").forEach(function(p) {
      p.addEventListener("click", function() {
        if (answered) return;
        answered = true;
        var clicked = p.dataset.code;
        var correct = clicked === s.code;
        var fb = document.getElementById("feedback");
        var mres = recordAnswer(s.code, correct);
        bumpStreak(correct);
        celebrate(correct, mres.justMastered);
        mapIds.forEach(function(id) {
          var match = document.querySelector('#' + id + ' path.state[data-code="' + clicked + '"]');
          if (match) match.classList.add(correct ? "correct" : "wrong");
          if (!correct) {
            var target = document.querySelector('#' + id + ' path.state[data-code="' + s.code + '"]');
            if (target) target.classList.add("reveal");
          }
          document.querySelectorAll('#' + id + ' path.state').forEach(function(el) { el.classList.remove("interactive"); });
          // Retire the fat tap targets too, so a second tap cannot land on one.
          document.querySelectorAll('#' + id + ' path.state-hit').forEach(function(el) { el.remove(); });
          animateState(id, clicked, correct);
        });
        if (correct) {
          fb.className = "feedback correct-fb";
          fb.textContent = (item.retry ? "💪 Got it this time! That’s " : "✓ Correct! That’s ") + s.name +
                           (mres.justMastered ? " — 🌟 State mastered!" : "");
        } else {
          fb.className = "feedback wrong-fb";
          fb.textContent = kindMiss() + " " + s.name + " is highlighted in orange.";
        }
        document.getElementById("masteryPips").innerHTML =
          masteryPipsHTML(s.code, mres.justMastered) + (correct ? factLineHTML(s.code) : "");

        var next = makeNextButton(qIndex + 1 >= queue.length ? "See Results" : "Next →", function() {
          qIndex++;
          onDone(correct, item);
          advanceQuestion();
        });
        fb.parentNode.insertBefore(next.el, fb.nextSibling);
        if (correct) scheduleAutoAdvance(next.go, advanceDelayFor(lastFactShown));
      });
    });
  });
}

/* ── FULL TEST (mixed) ── */
function startTest() {
  cancelAutoAdvance();
  streakCount = 0;
  mode = "test";
  roundLabel = "";
  var pool = shuffle(STATES.slice());
  queue = pool.map(function(s, i) {
    return { code: s.code, name: s.name, type: (i % 2 === 0 ? "spell" : "map") };
  });
  queue = shuffle(queue);
  qIndex = 0;
  score = 0;
  retriedThisRound = {};
  subScore = { spell: 0, spellTotal: 0, map: 0, mapTotal: 0 };
  missed = [];
  renderTestQuestion();
}

function renderTestQuestion() {
  if (qIndex >= queue.length) { clearRound(); renderTestResults(); return; }
  // Snapshot before the per-question totals below are incremented, so resuming
  // re-runs that increment exactly once rather than double-counting.
  saveRound(snapshotRound());
  var item = queue[qIndex];
  if (item.type === "spell") {
    subScore.spellTotal++;
    renderSpellQuestion(item, afterTestAnswer);
  } else {
    subScore.mapTotal++;
    renderMapQuestion(item, afterTestAnswer);
  }
}

function afterTestAnswer(correct, item) {
  if (correct) {
    score++;
    if (item.type === "spell") subScore.spell++; else subScore.map++;
  } else {
    missed.push(item);
    if (roundLabel === "Quick Round") queueRetry(item);
  }
}

function renderTestResults() {
  var total = queue.length;
  var pct = Math.round((score / total) * 100);
  var grade = pct >= 90 ? "A" : pct >= 80 ? "B" : pct >= 70 ? "C" : pct >= 60 ? "D" : "F";
  var gradeColor = pct >= 80 ? "#38a169" : pct >= 60 ? "#dd6b20" : "#e53e3e";
  if (score === total && total > 0) { soundVictory(); burstConfetti(46); }
  var newBest = recordBestRound(score, total);

  renderResultsScreen({
    title: (roundLabel === "Quick Round" ? "Quick Round Results" : "Full Test Results"),
    newBest: newBest,
    score: score,
    total: total,
    grade: grade,
    gradeColor: gradeColor,
    subLine: "Spelling: " + subScore.spell + "/" + subScore.spellTotal + "  &bull;  Map: " + subScore.map + "/" + subScore.mapTotal,
    missed: missed,
    onRetryMissed: function() {
      if (missed.length === 0) return;
      mode = "test";
      queue = shuffle(missed.slice());
      qIndex = 0;
      score = 0;
      subScore = { spell: 0, spellTotal: 0, map: 0, mapTotal: 0 };
      missed = [];
      renderTestQuestion();
    },
    onRestart: (roundLabel === "Quick Round" ? startQuickRound : startTest)
  });
}

/* ── SHARED RESULTS SCREEN ── */
function renderResultsScreen(cfg) {
  var pct = Math.round((cfg.score / cfg.total) * 100);
  var missedHTML = "";
  if (cfg.missed.length > 0) {
    missedHTML =
      '<div class="missed-list"><h3>Review these ' + cfg.missed.length + '</h3>' +
      cfg.missed.map(function(m) {
        return '<div class="missed-item"><span class="mi-name">' + esc(m.name) + '</span><span class="mi-type">' + (m.type === "spell" ? "Spelling" : "Map") + '</span></div>';
      }).join("") +
      '</div>';
  }
  var gradeHTML = cfg.grade ? '<div class="grade" style="color:' + cfg.gradeColor + '">Grade: ' + cfg.grade + '</div>' : "";
  var subLineHTML = cfg.subLine ? '<div class="sub-scores"><span>' + cfg.subLine + '</span></div>' : "";
  /* Never scold. Even a low score names something that went right. */
  var message = pct === 100 ? "Perfect round! You know your states! 🎉" :
                pct >= 80 ? "Great job! Almost there." :
                pct >= 50 ? "Nice work &mdash; you got " + cfg.score + " right!" :
                "You got " + cfg.score + " right. Every round makes the next one easier 💪";

  var data = loadData();
  var prof = data.activeProfile ? data.profiles[data.activeProfile] : null;
  var bestHTML = "";
  if (prof) {
    var bits = [];
    if (cfg.newBest) bits.push('<span class="new-best">🌟 New best for ' + cfg.total + ' questions!</span>');
    else if (prof.bestRound && prof.bestRound.total === cfg.total) bits.push('Best for ' + cfg.total + ': ' + prof.bestRound.score + '/' + cfg.total);
    if (prof.bestStreak) bits.push('Best streak: 🔥 ' + prof.bestStreak);
    if (bits.length) bestHTML = '<div class="best-line">' + bits.join(' &middot; ') + '</div>';
  }

  app.innerHTML =
    '<h1>' + cfg.title + '</h1>' +
    '<div class="prompt-card results">' +
      '<div class="score-big">' + cfg.score + '/' + cfg.total + '</div>' +
      '<div class="score-label">' + pct + '%</div>' +
      gradeHTML +
      subLineHTML +
      '<div class="message">' + message + '</div>' +
      bestHTML +
    '</div>' +
    missedHTML +
    '<div class="btn-row">' +
      '<button class="btn-restart" id="playMore">Play 5 more</button>' +
      (cfg.missed.length > 0 ? '<button class="btn-retry-missed" id="retryMissed">Retry Missed (' + cfg.missed.length + ')</button>' : '') +
      '<button class="btn-restart" id="restart">Try Again</button>' +
      '<button class="btn-home" id="toMenu">Back to Menu</button>' +
    '</div>';

  if (cfg.missed.length > 0) {
    document.getElementById("retryMissed").addEventListener("click", cfg.onRetryMissed);
  }
  // Momentum: another short round without going back to the menu first.
  document.getElementById("playMore").addEventListener("click", function() { startQuickRound(5); });
  document.getElementById("restart").addEventListener("click", cfg.onRestart);
  document.getElementById("toMenu").addEventListener("click", showMenu);
}

/* If anything throws (including inside a click handler), show a visible,
   recoverable error instead of leaving the screen looking frozen. */
window.addEventListener("error", function(e) {
  app.innerHTML =
    '<h1>Oops!</h1>' +
    '<div class="prompt-card"><p>Something went wrong: ' + esc((e && e.message) || "unknown error") + '</p></div>' +
    '<div class="btn-row"><button class="btn-restart" id="errRestart">Restart</button></div>';
  var b = document.getElementById("errRestart");
  if (b) b.addEventListener("click", function() { memCache = null; showMenu(); });
});

/* Boot. The page renders immediately from localStorage; the cloud pull is
   layered on top when (and if) it arrives, so a slow or absent network never
   delays the first screen. */
(function boot() {
  var adopted = adoptTokenFromHash();
  showMenu();
  if (adopted) {
    // A share link was just opened: pull that family's progress in, then show
    // the menu again so the road trip reflects it.
    cloudPull().then(function() { showMenu(); });
  } else if (cloudToken(false)) {
    cloudPull().then(function(found) { if (found) showMenu(); });
  }
})();
</script>
