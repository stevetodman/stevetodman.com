<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Grade 5 social studies practice: continents and West African kingdoms from Bayou Bridges.">
<title>World Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f1e8; color: #3b2a16; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  .container { max-width: 600px; width: 100%; }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 6px; color: #5b3414; }
  .subtitle { text-align: center; color: #7a6248; font-size: 0.95rem; margin-bottom: 24px; }
  .progress-bar { background: #eadcc8; border-radius: 999px; height: 10px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, #b45309, #d97706); height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .score-line { display: flex; justify-content: space-between; font-size: 0.9rem; color: #57534e; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 4px 16px rgba(91,52,20,0.08); margin-bottom: 20px; }
  .q-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #a16207; margin-bottom: 8px; }
  .q-text { font-size: 1.15rem; line-height: 1.55; color: #3b2a16; margin-bottom: 24px; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { display: block; width: 100%; padding: 14px 18px; font-size: 1.05rem; border: 2px solid #eadcc8; border-radius: 12px; background: #fff; color: #3b2a16; cursor: pointer; text-align: left; }
  .choice-btn:hover:not(:disabled) { border-color: #b45309; background: #fffbeb; }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { border-color: #15803d; background: #f0fdf4; color: #166534; font-weight: 600; }
  .choice-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #991b1b; }
  .choice-btn.reveal { border-color: #15803d; background: #f0fdf4; color: #166534; }
  .feedback { text-align: center; font-size: 1.1rem; font-weight: 600; margin-top: 18px; min-height: 28px; }
  .feedback.correct-fb { color: #15803d; }
  .feedback.wrong-fb { color: #dc2626; }
  .explain-box { margin-top: 14px; padding: 14px 16px; border-radius: 10px; font-size: 0.95rem; line-height: 1.55; }
  .explain-box.wrong-ex { background: #fef2f2; border-left: 4px solid #dc2626; color: #7f1d1d; }
  .explain-box.correct-ex { background: #f0fdf4; border-left: 4px solid #15803d; color: #14532d; }
  .next-btn { display: block; margin: 16px auto 0; padding: 12px 32px; font-size: 1rem; font-weight: 600; border: none; border-radius: 10px; background: linear-gradient(135deg, #b45309, #d97706); color: #fff; cursor: pointer; }
  .results { text-align: center; }
  .results .score-big { font-size: 3.5rem; font-weight: 700; color: #b45309; margin: 12px 0 4px; }
  .results .score-label { font-size: 1.1rem; color: #7a6248; margin-bottom: 20px; }
  .results .message { font-size: 1.15rem; margin-bottom: 24px; line-height: 1.5; }
  .missed-list { text-align: left; margin: 0 auto 24px; max-width: 480px; }
  .missed-list h3 { font-size: 1rem; color: #dc2626; margin-bottom: 10px; }
  .missed-item { padding: 10px 0; border-bottom: 1px solid #e7e5e4; font-size: 0.95rem; line-height: 1.4; }
  .missed-item .mi-answer { color: #15803d; font-weight: 600; }
  .missed-item .mi-explain { color: #7a6248; font-size: 0.88rem; margin-top: 4px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-row button { padding: 12px 28px; font-size: 1rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
  .btn-retry-missed { background: #dc2626; color: #fff; }
  .btn-restart { background: linear-gradient(135deg, #b45309, #d97706); color: #fff; }
  .btn-home { background: #44403c; color: #fff; }
  .menu-cards { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .menu-card { appearance: none; font: inherit; text-align: left; width: 100%; color: inherit; background: #fff; border-radius: 14px; padding: 22px 20px; box-shadow: 0 2px 12px rgba(91,52,20,0.07); cursor: pointer; border: 2px solid transparent; }
  .menu-card:hover { border-color: #b45309; }
  .menu-card h2 { font-size: 1.15rem; color: #5b3414; margin-bottom: 4px; }
  .menu-card p { font-size: 0.9rem; color: #7a6248; line-height: 1.4; }
  .menu-card .badge { display: inline-block; background: #b45309; color: #fff; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; }
  .concept-card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(91,52,20,0.06); border-left: 4px solid #b45309; }
  .concept-card h3 { font-size: 1.05rem; color: #5b3414; margin-bottom: 8px; }
  .concept-card p { font-size: 0.92rem; color: #44403c; line-height: 1.6; }
  .study-nav { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .study-nav button { padding: 10px 24px; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
  .back-link { display: block; text-align: center; color: #b45309; font-size: 0.9rem; margin-top: 12px; font-weight: 700; text-decoration: none; }
  .menu-card:focus-visible, .choice-btn:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #d97706; outline-offset: 2px; }
</style>
</head>
<body>
<main>
<div class="container" id="app"></div>
</main>
<script>
var GEO = [
  { question: "How many continents are there on Earth?", choices: ["7", "5", "6", "8"], answer: "7", explain: "The seven continents are Africa, Antarctica, Asia, Australia, Europe, North America, and South America.", tag: "Continents" },
  { question: "Which continent is also a country?", choices: ["Australia", "Africa", "Europe", "Antarctica"], answer: "Australia", explain: "Australia is both a continent and a country.", tag: "Continents" },
  { question: "Louisiana is on which continent?", choices: ["North America", "South America", "Europe", "Africa"], answer: "North America", explain: "The United States, including Louisiana, is in North America.", tag: "Continents" },
  { question: "Which ocean is on the east coast of the United States?", choices: ["Atlantic Ocean", "Pacific Ocean", "Indian Ocean", "Arctic Ocean"], answer: "Atlantic Ocean", explain: "The Atlantic is on the East Coast. The Pacific is on the West Coast.", tag: "Oceans" },
  { question: "Which is the largest ocean?", choices: ["Pacific Ocean", "Atlantic Ocean", "Indian Ocean", "Arctic Ocean"], answer: "Pacific Ocean", explain: "The Pacific is the largest and deepest ocean.", tag: "Oceans" },
  { question: "The Sahara Desert is on which continent?", choices: ["Africa", "Asia", "Australia", "South America"], answer: "Africa", explain: "The Sahara stretches across North Africa. West African kingdoms grew south of it and traded across it.", tag: "Africa" },
  { question: "Which continent is at the South Pole?", choices: ["Antarctica", "Arctic", "Australia", "Europe"], answer: "Antarctica", explain: "Antarctica is the icy continent around the South Pole. The Arctic is an ocean, not a continent.", tag: "Continents" },
  { question: "Europe and Asia share one giant landmass. That landmass is often called\u2026", choices: ["Eurasia", "Oceania", "Gondwana", "the Midwest"], answer: "Eurasia", explain: "Europe and Asia are counted as two continents, but they are connected as Eurasia.", tag: "Continents" }
];
var WEST = [
  { question: "Which three powerful West African kingdoms rose and fell between about 600 and 1600 CE?", choices: ["Ghana, Mali, and Songhai", "Egypt, Rome, and Mali", "Aztec, Inca, and Ghana", "Mali, Spain, and Ghana"], answer: "Ghana, Mali, and Songhai", explain: "Bayou Bridges Unit 2 centers on Ghana, then Mali, then Songhai.", tag: "West Africa" },
  { question: "West African kingdoms became wealthy mainly by trading\u2026", choices: ["gold and salt", "tea and silk", "oil and rubber", "silver and furs"], answer: "gold and salt", explain: "Gold came from mines in the south. Salt came from the Sahara.", tag: "Trade" },
  { question: "Why was salt so valuable in West Africa?", choices: ["People needed it to flavor and preserve food, and it was scarce in some regions", "It could be turned into gold", "It was the only rock in the Sahara", "Kings used it as paint"], answer: "People needed it to flavor and preserve food, and it was scarce in some regions", explain: "Places without salt mines would trade gold to get it.", tag: "Trade" },
  { question: "Mansa Musa was a famous ruler of\u2026", choices: ["Mali", "Ghana", "Songhai", "Egypt"], answer: "Mali", explain: "Mansa Musa ruled the Mali Empire in the 1300s.", tag: "Mali" },
  { question: "Mansa Musa is remembered for a huge pilgrimage to\u2026", choices: ["Mecca", "Rome", "Timbuktu only", "London"], answer: "Mecca", explain: "As a Muslim ruler, Mansa Musa made the hajj to Mecca.", tag: "Mansa Musa" },
  { question: "On his pilgrimage, Mansa Musa gave away so much gold that\u2026", choices: ["gold became less valuable in some cities for a time", "Mali ran out of salt", "the Sahara disappeared", "Europe discovered America"], answer: "gold became less valuable in some cities for a time", explain: "In places such as Cairo, so much gold entered the market that its value dropped.", tag: "Mansa Musa" },
  { question: "Timbuktu became famous as a center of\u2026", choices: ["learning, trade, and Islamic scholarship", "shipbuilding for the Pacific", "ice harvesting", "Roman law courts"], answer: "learning, trade, and Islamic scholarship", explain: "Timbuktu sat on trade routes and grew schools and libraries.", tag: "Timbuktu" },
  { question: "Which river was especially important to Ghana, Mali, and Songhai?", choices: ["Niger River", "Nile River", "Amazon River", "Mississippi River"], answer: "Niger River", explain: "The Niger River was a highway for people, goods, and ideas in West Africa.", tag: "Geography" },
  { question: "Traders crossed the Sahara in groups of camels called\u2026", choices: ["caravans", "fleets", "wagons", "longhouses"], answer: "caravans", explain: "Camel caravans carried gold, salt, and other goods across the desert.", tag: "Trade" },
  { question: "Which kingdom came first among Ghana, Mali, and Songhai?", choices: ["Ghana", "Mali", "Songhai", "They all began in the same year"], answer: "Ghana", explain: "Ghana rose first. Mali grew later. Songhai rose after Mali weakened.", tag: "West Africa" },
  { question: "Islam spread into West African kingdoms mainly through\u2026", choices: ["traders and scholars traveling the desert routes", "European ships in 1492", "the Roman army", "Inca messengers"], answer: "traders and scholars traveling the desert routes", explain: "People, languages, and religion traveled with the caravans.", tag: "Culture" },
  { question: "A good claim about these kingdoms is that they were powerful because\u2026", choices: ["they controlled valuable trade and important cities", "they had no neighbors", "they lived only in rainforests with no desert", "they never farmed"], answer: "they controlled valuable trade and important cities", explain: "Location plus gold-salt trade plus cities such as Timbuktu made the empires strong.", tag: "Claim" }
];
var ALL_QUESTIONS = GEO.concat(WEST);
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;"); }
function unesc(s) { var d = document.createElement("div"); d.innerHTML = s; return d.textContent; }
var questions, current, score, missed, answered, quizMode;
function showMenu() {
  var app = document.getElementById("app");
  app.innerHTML = "<h1>World Lab</h1><p class=\"subtitle\">Grade 5 social studies \u00b7 continents and West Africa</p><div class=\"menu-cards\"><button type=\"button\" class=\"menu-card\" data-mode=\"study\"><span class=\"badge\">Study</span><h2>Quick map in your head</h2><p>Continents first, then Ghana, Mali, and Songhai</p></button><button type=\"button\" class=\"menu-card\" data-mode=\"ten\"><span class=\"badge\">10 questions</span><h2>Tonight's round</h2><p>A short mixed set \u2014 one tap from question 1</p></button><button type=\"button\" class=\"menu-card\" data-mode=\"geo\"><span class=\"badge\">8 questions</span><h2>Continents and oceans</h2><p>Matches the continents assignment</p></button><button type=\"button\" class=\"menu-card\" data-mode=\"west\"><span class=\"badge\">12 questions</span><h2>West African kingdoms</h2><p>Gold, salt, Mansa Musa, Timbuktu</p></button><button type=\"button\" class=\"menu-card\" data-mode=\"all\"><span class=\"badge\">20 questions</span><h2>Full lab</h2><p>Geography plus Unit 2 together</p></button></div><a class=\"back-link\" href=\"/study/grade5.html\">Grade 5 hub</a><a class=\"back-link\" href=\"/study/us-states.html\">50 States Challenge</a><a class=\"back-link\" href=\"/study/archive/\">Past practice</a>";
  app.querySelectorAll(".menu-card").forEach(function(card) {
    card.addEventListener("click", function() {
      quizMode = card.dataset.mode;
      if (quizMode === "study") { showStudy(); return; }
      var pool;
      if (quizMode === "geo") pool = GEO.slice();
      else if (quizMode === "west") pool = WEST.slice();
      else if (quizMode === "ten") pool = shuffle(ALL_QUESTIONS).slice(0, 10);
      else pool = ALL_QUESTIONS.slice();
      startQuiz(pool);
    });
  });
}
function showStudy() {
  var app = document.getElementById("app");
  app.innerHTML = "<h1>World Lab</h1><p class=\"subtitle\">Say these out loud before a quiz</p><div class=\"concept-card\"><h3>7 continents</h3><p>Africa, Antarctica, Asia, Australia, Europe, North America, South America. Louisiana is in North America. The Sahara is in Africa.</p></div><div class=\"concept-card\"><h3>Oceans to know</h3><p>Pacific is largest and on the U.S. West Coast. Atlantic is on the East Coast. Also know Indian, Arctic, and Southern.</p></div><div class=\"concept-card\"><h3>Ghana to Mali to Songhai</h3><p>Three West African kingdoms. They grew rich on gold-and-salt trade across the Sahara. The Niger River was their water highway.</p></div><div class=\"concept-card\"><h3>Mansa Musa and Timbuktu</h3><p>Mansa Musa ruled Mali and made a famous pilgrimage to Mecca. Timbuktu was a city of trade and learning.</p></div><div class=\"study-nav\"><button class=\"btn-restart\" id=\"toQuiz\">Tonight's round</button><button class=\"btn-home\" id=\"toMenu\">Back to menu</button></div>";
  document.getElementById("toQuiz").addEventListener("click", function() { quizMode = "ten"; startQuiz(shuffle(ALL_QUESTIONS).slice(0, 10)); });
  document.getElementById("toMenu").addEventListener("click", showMenu);
}
function startQuiz(pool) { questions = shuffle(pool); current = 0; score = 0; missed = []; answered = false; renderQuestion(); }
function renderQuestion() {
  var app = document.getElementById("app");
  if (current >= questions.length) { renderResults(app); return; }
  var q = questions[current];
  var pct = Math.round((current / questions.length) * 100);
  var opts = shuffle(q.choices.slice());
  var choicesHTML = opts.map(function(c) { return "<button class=\"choice-btn\" data-val=\"" + esc(c) + "\">" + c + "</button>"; }).join("");
  app.innerHTML = "<h1>World Lab</h1><p class=\"subtitle\">Grade 5 social studies</p><div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:" + pct + "%\"></div></div><div class=\"score-line\"><span>Question " + (current + 1) + " of " + questions.length + "</span><span>" + score + " correct</span></div><div class=\"card\"><div class=\"q-label\">" + q.tag + "</div><div class=\"q-text\">" + q.question + "</div><div class=\"choices\">" + choicesHTML + "</div><div class=\"feedback\" id=\"feedback\"></div><div id=\"explainArea\"></div></div>";
  document.querySelectorAll(".choice-btn").forEach(function(btn) { btn.addEventListener("click", function() { handleAnswer(btn, q); }); });
}
function handleAnswer(btn, q) {
  if (answered) return;
  answered = true;
  var chosen = unesc(btn.dataset.val);
  var isCorrect = chosen === q.answer;
  var fb = document.getElementById("feedback");
  document.querySelectorAll(".choice-btn").forEach(function(b) { b.disabled = true; if (unesc(b.dataset.val) === q.answer) b.classList.add(isCorrect ? "correct" : "reveal"); });
  if (isCorrect) { btn.classList.add("correct"); fb.textContent = "Correct!"; fb.className = "feedback correct-fb"; score++; }
  else { btn.classList.add("wrong"); fb.textContent = "Not quite!"; fb.className = "feedback wrong-fb"; missed.push(q); }
  document.getElementById("explainArea").innerHTML = "<div class=\"explain-box " + (isCorrect ? "correct-ex" : "wrong-ex") + "\"><strong>" + (isCorrect ? "Nice!" : "Here's why:") + "</strong> " + q.explain + "</div>";
  var nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  nextBtn.textContent = current + 1 < questions.length ? "Next" : "See Results";
  nextBtn.addEventListener("click", function() { current++; answered = false; renderQuestion(); });
  document.querySelector(".card").appendChild(nextBtn);
}
function renderResults(app) {
  var pct = Math.round((score / questions.length) * 100);
  var msg = pct === 100 ? "Perfect. You can place the kingdoms on the map in your head." : pct >= 80 ? "Strong. Review the missed ones once." : pct >= 60 ? "Good start. Read the explanations and retry missed." : "Use the quick map, then try tonight's round again.";
  var missedHTML = "";
  if (missed.length) {
    missedHTML = "<div class=\"missed-list\"><h3>To review (" + missed.length + ")</h3>" + missed.map(function(m) { return "<div class=\"missed-item\"><strong>" + m.question + "</strong><br><span class=\"mi-answer\">Answer: " + m.answer + "</span><div class=\"mi-explain\">" + m.explain + "</div></div>"; }).join("") + "</div>";
  }
  var retryBtn = missed.length ? "<button class=\"btn-retry-missed\" id=\"retryMissed\">Retry missed (" + missed.length + ")</button>" : "";
  app.innerHTML = "<h1>World Lab</h1><p class=\"subtitle\">Grade 5 social studies</p><div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:100%\"></div></div><div class=\"card results\"><div class=\"score-big\">" + pct + "%</div><div class=\"score-label\">" + score + " out of " + questions.length + " correct</div><div class=\"message\">" + msg + "</div>" + missedHTML + "<div class=\"btn-row\">" + retryBtn + "<button class=\"btn-restart\" id=\"restart\">Play again</button><button class=\"btn-home\" id=\"home\">Back to menu</button></div></div>";
  document.getElementById("restart").addEventListener("click", function() {
    if (quizMode === "geo") startQuiz(GEO.slice());
    else if (quizMode === "west") startQuiz(WEST.slice());
    else if (quizMode === "ten") startQuiz(shuffle(ALL_QUESTIONS).slice(0, 10));
    else startQuiz(ALL_QUESTIONS.slice());
  });
  document.getElementById("home").addEventListener("click", showMenu);
  if (missed.length) document.getElementById("retryMissed").addEventListener("click", function() { startQuiz(missed.slice()); });
}
showMenu();
</script>
</body>
</html>
