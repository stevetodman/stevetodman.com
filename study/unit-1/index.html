<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="One-tap Unit 1 vocabulary, synonym, antonym, and spelling practice.">
  <meta name="theme-color" content="#17324d">
  <title>Unit 1 Word Expedition</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="/study/us-states.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-lockup">
        <p class="kicker">Unit 1 · 12 words</p>
        <h1>Word Expedition</h1>
      </div>
      <button class="profile-chip" id="profile-chip" type="button" aria-label="Switch learner" hidden></button>
    </header>
    <p class="save-warning" id="save-warning" role="status" hidden></p>
    <div id="app" aria-live="polite"></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="game-art.js"></script>
  <script src="quality-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
