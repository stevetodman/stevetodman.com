name: Math Mission essential

on:
  pull_request:
    paths:
      - 'math/**'
      - 'tests/math-mission*.test.mjs'
      - 'tests/math-learning*.test.mjs'
      - 'tests/helpers/harness.mjs'
      - '.github/workflows/math-mission-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'math/**'
      - 'tests/math-mission*.test.mjs'
      - 'tests/math-learning*.test.mjs'
      - 'tests/helpers/harness.mjs'
      - '.github/workflows/math-mission-ci.yml'
  workflow_dispatch:

concurrency:
  group: math-mission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  essential:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Four learning invariants
        run: node --test tests/math-learning-invariants.test.mjs

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: One 390px Chromium phone smoke
        run: node --test tests/math-learning-browser.test.mjs
