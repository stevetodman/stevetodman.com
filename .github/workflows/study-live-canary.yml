name: Study live canary

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: study-live-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Study deployment verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: a038ca078a3d07aa78e0d869105986e16c81f03a
      SITE_ORIGIN: https://stevetodman.com
      DEPLOYMENT_ORIGIN: https://eda8e45b.stevetodman-com.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard the isolated verification branch
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "$TARGET_SHA"..HEAD | grep -Ev '^(.github/workflows/study-live-canary.yml|scripts/verify-study-deployment.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Verification branch contains unexpected changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Confirm current main is still the deployment target
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(curl --fail --silent --show-error             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.commit.sha')"
          if [ "$current_main" != "$TARGET_SHA" ]; then
            echo "main advanced: expected $TARGET_SHA, found $current_main" >&2
            exit 1
          fi
          echo "main remains pinned to $TARGET_SHA"
          echo "Cloudflare deployment already independently confirmed: $DEPLOYMENT_ORIGIN"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the target production artifact
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact live Study deployment in an iPhone-sized browser
        run: node scripts/verify-study-deployment.mjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-production-a038ca0-evidence
          path: .verification-artifacts/
          if-no-files-found: warn
          retention-days: 7
