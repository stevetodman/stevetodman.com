name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'phs/**'
      - 'steven-os/**'
      - 'tests/**'
      - 'tools/**'
      - 'cooking/**'
      - 'study/**'
      - 'admin/**'
      - 'genetics-chd/**'
      - 'pedcardsurg/**'
      - 'newbornscreen/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'phs/**'
      - 'steven-os/**'
      - 'tests/**'
      - 'tools/**'
      - 'cooking/**'
      - 'study/**'
      - 'admin/**'
      - 'genetics-chd/**'
      - 'pedcardsurg/**'
      - 'newbornscreen/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  steven_os:
    name: Steven OS core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Steven OS policy and routing
        run: npm run test:steven-os

  behaviour:
    name: Behavioural tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in phs/v17/*.js genetics-chd/assets/*.js pedcardsurg/assets/*.js tests/*.mjs tests/helpers/*.mjs steven-os/lib/*.mjs; do
            node --check "$file"
          done

      - name: Verify case package integrity
        run: npm run test:integrity

      - name: Simulator behaviour
        run: npm run test:phs

      - name: UI-only audit remediation regression
        run: node --test tests/phs-v18-audit-remediation.test.mjs

      - name: Clinical validation regression
        run: node --test tests/phs-clinical-validation.test.mjs

      - name: BP calculator correctness
        run: npm run test:bp

      - name: Genetics of CHD academy
        run: npm run test:genetics-chd

      - name: PedCardSurg academy
        run: npm run test:pedcardsurg

      - name: Site conventions and smoke
        if: ${{ !cancelled() }}
        run: npm run test:smoke
