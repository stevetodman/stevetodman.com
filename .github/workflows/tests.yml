name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'phs/**'
      - 'steven-os/**'
      - 'tests/**'
      - '!tests/study-*.test.mjs'
      - '!tests/fixtures/study-*'
      - 'scripts/**'
      - '!scripts/verify-study-*'
      - 'tools/**'
      - 'cooking/**'
      - 'math/**'
      - 'study/*.html'
      - 'admin/**'
      - 'newbornscreen/**'
      - 'kawasaki/**'
      - 'hypertension/**'
      - 'cardiovascular-risk/**'
      - 'aortopathy/**'
      - 'genetics-chd/**'
      - 'myocarditis/**'
      - 'pals/**'
      - 'pedcardsurg/**'
      - 'cardiohospital/**'
      - 'about/**'
      - 'contact/**'
      - 'privacy/**'
      - 'education/**'
      - 'search/**'
      - 'site/**'
      - 'clinical/**'
      - '.well-known/**'
      - '_headers'
      - 'robots.txt'
      - '404.html'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'MASTER_PLAN.md'
      - 'CLAUDE.md'
      - 'DEPLOYMENT.md'
      - 'PR_TRIAGE.md'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'phs/**'
      - 'steven-os/**'
      - 'tests/**'
      - '!tests/study-*.test.mjs'
      - '!tests/fixtures/study-*'
      - 'scripts/**'
      - '!scripts/verify-study-*'
      - 'tools/**'
      - 'cooking/**'
      - 'math/**'
      - 'study/*.html'
      - 'admin/**'
      - 'newbornscreen/**'
      - 'kawasaki/**'
      - 'hypertension/**'
      - 'cardiovascular-risk/**'
      - 'aortopathy/**'
      - 'genetics-chd/**'
      - 'myocarditis/**'
      - 'pals/**'
      - 'pedcardsurg/**'
      - 'cardiohospital/**'
      - 'about/**'
      - 'contact/**'
      - 'privacy/**'
      - 'education/**'
      - 'search/**'
      - 'site/**'
      - 'clinical/**'
      - '.well-known/**'
      - '_headers'
      - 'robots.txt'
      - '404.html'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'MASTER_PLAN.md'
      - 'CLAUDE.md'
      - 'DEPLOYMENT.md'
      - 'PR_TRIAGE.md'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform_policy:
    name: Platform policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deployment, privacy, governance, provenance, and budgets
        run: npm run test:platform

  steven_os:
    name: Steven OS core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Steven OS policy and routing
        run: npm run test:steven-os

  syntax_integrity:
    name: Syntax and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find phs/v17 steven-os study math tools genetics-chd pedcardsurg hypertension cardiovascular-risk aortopathy myocarditis pals newbornscreen tests site scripts search \
            -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Verify case package integrity
        run: npm run test:integrity

  browser_tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: Simulator tests
            command: npm run test:phs && node --test tests/phs-v18-audit-remediation.test.mjs && node --test tests/phs-clinical-validation.test.mjs
          - name: BP calculator tests
            command: npm run test:bp
          - name: Acute-care academies
            command: npm run test:kawasaki && npm run test:myocarditis && npm run test:pals
          - name: Prevention academies
            command: npm run test:hypertension && npm run test:cardiovascular-risk && npm run test:aortopathy
          - name: Genetics and surgery academies
            command: npm run test:genetics-chd && npm run test:pedcardsurg
          - name: Site smoke
            command: npm run test:smoke
          - name: Accessibility
            command: npm run test:a11y
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
