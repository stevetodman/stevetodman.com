name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'phs/**'
      - 'steven-os/**'
      - 'tests/**'
      - 'tools/**'
      - 'cooking/**'
      - 'study/**'
      - 'math/**'
      - 'admin/**'
      - 'newbornscreen/**'
      - 'kawasaki/**'
      - 'hypertension/**'
      - 'cardiovascular-risk/**'
      - 'aortopathy/**'
      - 'genetics-chd/**'
      - 'myocarditis/**'
      - 'pals/**'
      - 'pedcardsurg/**'
      - 'cardiohospital/**'
      - 'about/**'
      - 'education/**'
      - 'search/**'
      - 'site/**'
      - 'clinical/**'
      - '.well-known/**'
      - '_headers'
      - 'robots.txt'
      - '404.html'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'phs/**'
      - 'steven-os/**'
      - 'tests/**'
      - 'tools/**'
      - 'cooking/**'
      - 'study/**'
      - 'math/**'
      - 'admin/**'
      - 'newbornscreen/**'
      - 'kawasaki/**'
      - 'hypertension/**'
      - 'cardiovascular-risk/**'
      - 'aortopathy/**'
      - 'genetics-chd/**'
      - 'myocarditis/**'
      - 'pals/**'
      - 'pedcardsurg/**'
      - 'cardiohospital/**'
      - 'about/**'
      - 'education/**'
      - 'search/**'
      - 'site/**'
      - 'clinical/**'
      - '.well-known/**'
      - '_headers'
      - 'robots.txt'
      - '404.html'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform_policy:
    name: Platform policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deployment, privacy, governance, provenance, and budgets
        run: npm run test:platform

  steven_os:
    name: Steven OS core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Steven OS policy and routing
        run: npm run test:steven-os

  behaviour:
    name: Behavioural tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find phs/v17 steven-os study tools genetics-chd pedcardsurg hypertension cardiovascular-risk aortopathy myocarditis pals newbornscreen tests \
            -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Verify case package integrity
        run: npm run test:integrity

      - name: Simulator behaviour
        if: ${{ !cancelled() }}
        run: npm run test:phs

      - name: UI-only audit remediation regression
        if: ${{ !cancelled() }}
        run: node --test tests/phs-v18-audit-remediation.test.mjs

      - name: Clinical validation regression
        if: ${{ !cancelled() }}
        run: node --test tests/phs-clinical-validation.test.mjs

      - name: BP calculator correctness
        if: ${{ !cancelled() }}
        run: npm run test:bp

      - name: Kawasaki academy
        if: ${{ !cancelled() }}
        run: npm run test:kawasaki

      - name: Hypertension academy
        if: ${{ !cancelled() }}
        run: npm run test:hypertension

      - name: Cardiovascular prevention academy
        if: ${{ !cancelled() }}
        run: npm run test:cardiovascular-risk

      - name: Aortopathy academy
        if: ${{ !cancelled() }}
        run: npm run test:aortopathy

      - name: Myocarditis academy
        if: ${{ !cancelled() }}
        run: npm run test:myocarditis

      - name: PALS academy
        if: ${{ !cancelled() }}
        run: npm run test:pals

      - name: Genetics of CHD academy
        if: ${{ !cancelled() }}
        run: npm run test:genetics-chd

      - name: PedCardSurg academy
        if: ${{ !cancelled() }}
        run: npm run test:pedcardsurg

      - name: Site conventions and smoke
        if: ${{ !cancelled() }}
        run: npm run test:smoke

      - name: Shared platform accessibility
        if: ${{ !cancelled() }}
        run: npm run test:a11y
