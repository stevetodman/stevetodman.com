name: Finalize States plan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-states-plan.yml'

concurrency:
  group: finalize-states-plan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded States changes
        run: node .github/finalize-states-plan.cjs
      - name: Check patch
        run: git diff --check
      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study/us-states.html
          git commit -m 'Finish 50 States school-test adaptation'
          git push origin HEAD:main
