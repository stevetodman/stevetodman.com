name: Word Expedition smoke debug

on:
  push:
    branches:
      - agent/word-expedition-teacher-word-bank

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture Study smoke output
        shell: bash
        run: npm run test:study:smoke > smoke-debug.txt 2>&1 || true
      - name: Commit debug output
        shell: bash
        run: |
          git config user.name "study-agent"
          git config user.email "study-agent@users.noreply.github.com"
          git add -f smoke-debug.txt
          git commit -m "Agent: capture word-bank smoke failure"
          git push origin HEAD:agent/word-expedition-teacher-word-bank
