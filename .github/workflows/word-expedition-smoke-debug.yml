name: Word Expedition smoke expectation fix

on:
  push:
    branches:
      - agent/word-expedition-teacher-word-bank

permissions:
  contents: write

jobs:
  fix-test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align browser smoke tests to teacher-bank contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/study-word-mission.test.mjs')
          s=p.read_text()

          old="""    await answerCorrectly(page);\n    await page.locator('#listen').click();\n    assert.match(await page.locator('#toast').innerText(),/read this question instead/);\n    assert.doesNotMatch(await page.locator('#toast').innerText(),/tiles/,'meaning questions do not offer nonexistent spelling controls');\n    for(let i=1;i<7;i++)await answerCorrectly(page);\n"""
          new="""    await answerCorrectly(page);\n    assert.equal(await page.locator('#listen').count(),0,'word-bank vocabulary clues are readable and do not depend on speech');\n    assert.equal(await page.locator('.choice').count(),12,'vocabulary keeps the complete assigned word bank visible');\n    for(let i=1;i<7;i++)await answerCorrectly(page);\n"""
          if old not in s: raise SystemExit('audio smoke block not found')
          s=s.replace(old,new)

          old="""    await page.locator('#next-question').click();\n    assert.equal(await page.locator('.monster-dialogue').count(),1,'meaning practice uses monster dialogue');\n    assert.match(await page.locator('.dialogue-speaker').innerText(),/Bramble Troll/);\n    for(let i=1;i<7;i++)await answerCorrectly(page);\n"""
          new="""    await page.locator('#next-question').click();\n    assert.equal(await page.locator('.monster-dialogue').count(),0,'gameplay presentation cannot add alternate vocabulary instruction');\n    assert.equal(await page.locator('.choice').count(),12,'meaning practice uses the complete teacher word bank');\n    assert.match(await page.locator('.q-prompt').innerText(),/Which vocabulary word/);\n    for(let i=1;i<7;i++)await answerCorrectly(page);\n"""
          if old not in s: raise SystemExit('monster dialogue smoke block not found')
          s=s.replace(old,new)

          old="""    assert.match(await page.locator('.monster-taunt').innerText(),/soggy turnip/);\n    assert.equal(await page.locator('.monster-taunt .target').innerText(),await page.locator('#correction-form strong').innerText(),'taunt models the missed word');\n"""
          new="""    assert.match(await page.locator('.monster-taunt').innerText(),/soggy turnip/);\n    assert.equal(await page.locator('.monster-taunt .target').count(),0,'monster flavor never models or teaches the missed word');\n"""
          if old not in s: raise SystemExit('taunt smoke block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:study:unit
      - run: npm run test:study:smoke
      - run: npm run build
      - name: Commit tested smoke fix and remove debug scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/word-expedition-smoke-debug.yml smoke-debug.txt
          git config user.name "study-agent"
          git config user.email "study-agent@users.noreply.github.com"
          git add tests/study-word-mission.test.mjs .github/workflows/word-expedition-smoke-debug.yml smoke-debug.txt
          git commit -m "Word Expedition: align smoke checks to teacher word bank"
          git push origin HEAD:agent/word-expedition-teacher-word-bank
