name: Study contract

on:
  pull_request:
    paths:
      - 'study/**'
      - 'tests/study-*.test.mjs'
      - 'scripts/verify-study-production.mjs'
      - '_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/study-contract.yml'
  push:
    branches:
      - main
      - 'study/quality-*'
    paths:
      - 'study/**'
      - 'tests/study-*.test.mjs'
      - 'scripts/verify-study-production.mjs'
      - '_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/study-contract.yml'
  workflow_dispatch:

concurrency:
  group: study-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Study contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:study:unit
      - run: npm run test:study:smoke
      - name: Validate iPhone audio path in WebKit
        run: npm run test:study:webkit
      - run: npm run build
      - name: Save focused Study screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-rendered-evidence-chromium
          path: ${{ runner.temp }}/study-evidence/
          if-no-files-found: ignore

  live-deployment:
    name: Study live deployment
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Study deployment
        env:
          SITE_ORIGIN: https://stevetodman.com
        run: |
          for attempt in $(seq 1 20); do
            npm run verify:study-production && exit 0
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 30
          done
