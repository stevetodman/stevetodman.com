name: Study contract

on:
  pull_request:
    paths:
      - 'study/*.html'
      - 'study/unit-1/**'
      - 'study/icons/**'
      - 'study/*.webmanifest'
      - 'study/sw.js'
      - 'tests/study-*.test.mjs'
      - 'tests/site-smoke.test.mjs'
      - 'site/catalog.json'
      - 'scripts/build-site.mjs'
      - 'scripts/study-release.mjs'
      - 'scripts/verify-study-release.mjs'
      - 'scripts/verify-study-production.mjs'
      - '_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/study-contract.yml'
      - '.github/workflows/study-live-canary.yml'
  push:
    branches:
      - main
      - 'study/quality-*'
    paths:
      - 'study/*.html'
      - 'study/unit-1/**'
      - 'study/icons/**'
      - 'study/*.webmanifest'
      - 'study/sw.js'
      - 'tests/study-*.test.mjs'
      - 'tests/site-smoke.test.mjs'
      - 'site/catalog.json'
      - 'scripts/build-site.mjs'
      - 'scripts/study-release.mjs'
      - 'scripts/verify-study-release.mjs'
      - 'scripts/verify-study-production.mjs'
      - '_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/study-contract.yml'
      - '.github/workflows/study-live-canary.yml'
  workflow_dispatch:

concurrency:
  group: study-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Study unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:study:unit
      - run: npm run build

  chromium-smoke:
    name: Study Chromium smoke
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:study:smoke
      - name: Save screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: study-failure-evidence-chromium
          path: ${{ runner.temp }}/study-evidence/
          if-no-files-found: ignore

  webkit-iphone:
    name: Study iPhone WebKit
    needs: contract
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npm run test:study:webkit
