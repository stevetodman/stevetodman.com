name: Study contract

on:
  pull_request:
    paths:
      - 'study/**'
      - '!study/*.md'
      - '!study/**/*.md'
      - '!study/pin-sprint.html'
      - '!study/us-states.html'
      - '!study/supabase/functions/studyhub-save/**'
      - 'tests/study-*.test.mjs'
      - 'tests/grade5-*.test.mjs'
      - 'tests/science-grade5-*.test.mjs'
      - 'tests/social-grade5-*.test.mjs'
      - 'tests/site-smoke.test.mjs'
      - 'site/catalog.json'
      - 'scripts/build-site.mjs'
      - 'scripts/study-release.mjs'
      - 'scripts/verify-study-release.mjs'
      - 'scripts/verify-study-production.mjs'
      - '_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/study-contract.yml'
      - '.github/workflows/study-live-canary.yml'
  push:
    branches:
      - main
      - 'study/quality-*'
    paths:
      - 'study/**'
      - '!study/*.md'
      - '!study/**/*.md'
      - '!study/pin-sprint.html'
      - '!study/us-states.html'
      - '!study/supabase/functions/studyhub-save/**'
      - 'tests/study-*.test.mjs'
      - 'tests/grade5-*.test.mjs'
      - 'tests/science-grade5-*.test.mjs'
      - 'tests/social-grade5-*.test.mjs'
      - 'tests/site-smoke.test.mjs'
      - 'site/catalog.json'
      - 'scripts/build-site.mjs'
      - 'scripts/study-release.mjs'
      - 'scripts/verify-study-release.mjs'
      - 'scripts/verify-study-production.mjs'
      - '_headers'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/study-contract.yml'
      - '.github/workflows/study-live-canary.yml'
  workflow_dispatch:

concurrency:
  group: study-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Study unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:study:unit
      - name: Build static educational site only
        run: node scripts/build-site.mjs && node scripts/build-search-index.mjs

  webkit-iphone:
    name: Study iPhone WebKit
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npm run test:study:webkit
