name: Zero-trust forensic audit repair

on:
  push:
    branches:
      - audit/forensic-zero-trust-20260904
    paths:
      - .github/workflows/forensic-zero-trust-repair.yml

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  AUDIT_CUTOFF: '2026-09-04T21:47:49Z'

jobs:
  repo-history-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Stage audit tools outside checkout
        run: |
          mkdir -p /tmp/forensic-tools
          cp scripts/forensic_repo_audit.py /tmp/forensic-tools/
          cp scripts/forensic_repo_full.py /tmp/forensic-tools/
          cp scripts/forensic_audit_extras.py /tmp/forensic-tools/
      - name: Install binary inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libimage-exiftool-perl tesseract-ocr git-lfs p7zip-full
      - name: Scan all branch, tag, and retained PR Git refs
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: /tmp/forensic-tools
        run: python3 /tmp/forensic-tools/forensic_repo_full.py
      - name: Run provider-aware supplemental patterns
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: /tmp/forensic-tools
        run: python3 /tmp/forensic-tools/forensic_audit_extras.py --mode supplemental-git --out audit-out/repo
      - name: OCR every reachable PDF page
        env:
          PYTHONPATH: /tmp/forensic-tools
        run: python3 /tmp/forensic-tools/forensic_audit_extras.py --mode pdf-ocr --out audit-out/repo
      - name: Deep-scan compressed historical archives
        env:
          PYTHONPATH: /tmp/forensic-tools
        run: python3 /tmp/forensic-tools/forensic_audit_extras.py --mode deep-archives --out audit-out/repo
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-repo-history-repair
          path: audit-out/repo
          if-no-files-found: error
          retention-days: 1

  actions-artifacts-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install binary inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libimage-exiftool-perl tesseract-ocr p7zip-full
      - name: Scan pre-audit Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/forensic_api_runner.py --mode actions-artifacts --shard ${{ matrix.shard }} --shards 4 --out audit-out/actions-artifacts-repair-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-actions-artifacts-repair-${{ matrix.shard }}
          path: audit-out/actions-artifacts-repair-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
