name: PHS v1.7 integrity

on:
  push:
    paths:
      - 'phs/**'
      - '.github/workflows/phs-v17-integrity.yml'
  pull_request:
    paths:
      - 'phs/**'
      - '.github/workflows/phs-v17-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify package dependencies and case cross-references
        run: node phs/v17/tests/integrity.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in phs/v17/*.js; do
            node --check "$file"
          done
