name: Word Expedition feedback sync once

on:
  push:
    branches:
      - agent/word-expedition-feedback-sync

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/word-expedition-feedback-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused feedback and timing patch
        run: |
          python3 .github/scripts/word-expedition-feedback-sync.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('study/unit-1/app.js')
          text=p.read_text()
          old="""    setBattleState(final?'victory':kind,message,true);\n    pulseQuestionFeedback(kind==='recovery'?'recovery':kind==='standard'?'assisted':'correct');\n    cancelSpeech();playWeaponSound(gameProfile(activeName).equipped.weapon);\n"""
          new="""    pulseQuestionFeedback(kind==='recovery'?'recovery':kind==='standard'?'assisted':'correct');\n    setBattleState(final?'victory':kind,message,true);\n    cancelSpeech();playWeaponSound(gameProfile(activeName).equipped.weapon);\n"""
          if text.count(old)!=1:
              raise SystemExit('Expected one successful-strike feedback block')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Syntax and whitespace
        run: |
          node --check study/unit-1/app.js
          git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Study browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Study unit regression suite
        run: npm run test:study:unit
      - name: Study browser smoke suite
        run: |
          set +e
          npm run test:study:smoke > /tmp/study-smoke.log 2>&1
          code=$?
          cat /tmp/study-smoke.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/study-smoke.log .github/word-expedition-smoke-failure.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/word-expedition-smoke-failure.txt
            git commit -m "Capture Word Expedition smoke failure"
            git push origin HEAD:agent/word-expedition-feedback-sync
            exit "$code"
          fi
      - name: iPhone WebKit audio regression suite
        run: npm run test:study:webkit
      - name: Production build
        run: npm run build
      - name: Commit production change and remove one-shot machinery
        run: |
          rm -f .github/workflows/word-expedition-feedback-sync-once.yml
          rm -f .github/scripts/word-expedition-feedback-sync.py
          rm -f .github/word-expedition-smoke-failure.txt
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Polish Word Expedition answer and impact feedback"
          git push origin HEAD:agent/word-expedition-feedback-sync
