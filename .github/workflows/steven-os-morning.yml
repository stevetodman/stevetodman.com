name: Steven OS Morning Brief

on:
  schedule:
    # 12:00 UTC ≈ 07:00 CDT
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Snapshot live brief
        env:
          STEVEN_OS_SECRET: ${{ secrets.STEVEN_OS_SECRET }}
        run: node steven-os/scripts/run-morning.mjs --skip-sync

      - name: Upload brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: steven-os-brief
          path: |
            steven-os/state/latest-brief.txt
            steven-os/state/latest-brief.json
          retention-days: 14
