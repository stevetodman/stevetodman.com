name: Unified Hospital Build

on:
  push:
    branches: [hospital-unified]
    paths:
      - "cardio-hospital-3d/**"
      - ".github/workflows/hospital-unified-ci.yml"
  pull_request:
    paths:
      - "cardio-hospital-3d/**"
      - ".github/workflows/hospital-unified-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cardio-hospital-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
