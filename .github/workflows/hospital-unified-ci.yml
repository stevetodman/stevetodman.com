name: Unified Hospital Build

on:
  push:
    branches: [main]
    paths:
      - "cardio-hospital-3d/**"
      - ".github/workflows/hospital-unified-ci.yml"
  pull_request:
    paths:
      - "cardio-hospital-3d/**"
      - ".github/workflows/hospital-unified-ci.yml"

concurrency:
  group: hospital-unified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cardio-hospital-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:engine
      - run: npm run build
