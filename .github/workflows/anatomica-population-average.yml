name: Anatomica Population-Average Exterior

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/anatomica/build_population_average.py'
      - 'tools/anatomica/requirements-population-average.txt'
      - '.github/workflows/anatomica-population-average.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/anatomica/requirements-population-average.txt

      - name: Install dependencies
        run: pip install -r tools/anatomica/requirements-population-average.txt

      - name: Test boundary extraction
        working-directory: tools/anatomica
        run: python -m unittest -v test_population_average.py test_coronary_fit.py

      - name: Build population-average geometry foundation
        run: |
          python tools/anatomica/build_population_average.py \
            --work .cache/anatomica-population-average \
            --output population_average_output

      - name: Show geometry report
        if: always()
        run: |
          test -f population_average_output/geometry_report.json \
            && cat population_average_output/geometry_report.json \
            || true

      - name: Fit attributable coronary scaffold
        run: |
          python tools/anatomica/fit_z_anatomy_coronaries.py \
            --centerlines tools/anatomica/data/z_anatomy_coronary_centerlines.json.gz \
            --work .cache/anatomica-population-average \
            --foundation population_average_output/population_average_tissue_surfaces.glb \
            --output coronary_scaffold_output

      - name: Upload geometry and QA renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomica-population-average-exterior
          path: |
            population_average_output/*.glb
            population_average_output/*.json
            population_average_output/*.png
            population_average_output/*.md
            population_average_output/axis_renders/
            coronary_scaffold_output/
          if-no-files-found: error
          retention-days: 14
