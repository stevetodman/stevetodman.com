name: Update Cooking Index

on:
  push:
    branches:
      - main
    paths:
      - 'cooking/*-timer.html'
  workflow_dispatch:

concurrency:
  group: update-cooking-index
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-index:
    name: Rebuild cooking index
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate cooking index
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html
          import re

          root = Path('cooking')
          cards = []

          def first_match(pattern, text, default=''):
              match = re.search(pattern, text, re.I | re.S)
              return html.unescape(match.group(1).strip()) if match else default

          def emoji_for(filename):
              name = filename.lower()
              if 'ribeye' in name or 'steak' in name or 'beef' in name:
                  return '🥩'
              if 'rib' in name:
                  return '🍖'
              if 'chicken' in name:
                  return '🍗'
              if 'fish' in name or 'salmon' in name or 'tuna' in name:
                  return '🐟'
              if 'pork' in name:
                  return '🐷'
              if 'pasta' in name:
                  return '🍝'
              if 'bread' in name:
                  return '🍞'
              if 'cake' in name or 'dessert' in name:
                  return '🍰'
              return '🍳'

          for path in sorted(root.glob('*-timer.html')):
              text = path.read_text(encoding='utf-8')
              title = first_match(r'<title>([^<]+)</title>', text, path.stem)
              title = re.sub(r'\s+Timer$', '', title, flags=re.I)
              credit = first_match(r'class=["\']recipe-credit["\'][^>]*>([^<]+)<', text)
              time_match = re.search(r'~[0-9.]+\s+(?:hours?|min(?:utes?)?)(?:\s+total)?', text, re.I)
              time_est = time_match.group(0) if time_match else 'See recipe'
              cards.append(f'''<a href="{html.escape(path.name)}" class="timer-card">
                <div class="timer-title">{emoji_for(path.name)} {html.escape(title)}</div>
                <div class="timer-meta">{html.escape(credit)}</div>
                <span class="timer-time">{html.escape(time_est)}</span>
              </a>''')

          document = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Step-by-step cooking timers with audio alerts, progress tracking, and doneness cues.">
            <title>Cooking Timers</title>
            <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; padding: 24px; }
              .back-link { display: inline-block; color: #00cec9; text-decoration: none; margin-bottom: 24px; font-size: 0.9rem; }
              .back-link:hover { text-decoration: underline; }
              h1 { font-size: 2rem; text-align: center; margin-bottom: 8px; }
              .subtitle { text-align: center; opacity: 0.7; margin-bottom: 32px; font-size: 1rem; }
              .timers { max-width: 600px; margin: 0 auto; }
              .timer-card { background: #1e3a5f; border-radius: 16px; padding: 20px; margin-bottom: 16px; text-decoration: none; color: #fff; display: block; transition: transform 0.2s, box-shadow 0.2s; }
              .timer-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 184, 148, 0.2); }
              .timer-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
              .timer-meta { font-size: 0.9rem; opacity: 0.7; }
              .timer-time { display: inline-block; background: rgba(0, 184, 148, 0.2); color: #2ee6e0; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; margin-top: 10px; }
              a:focus-visible, button:focus-visible { outline: 3px solid #00cec9; outline-offset: 2px; }
            </style>
          </head>
          <body>
            <main>
              <a href="/" class="back-link">← Back to Home</a>
              <h1>🍳 Cooking Timers</h1>
              <p class="subtitle">Step-by-step timers for complex recipes</p>
              <div class="timers">
          ''' + '\n'.join(cards) + '''
              </div>
            </main>
          </body>
          </html>
          '''

          root.joinpath('index.html').write_text(document, encoding='utf-8')
          PY

      - name: Commit generated index when changed
        shell: bash
        run: |
          git add cooking/index.html
          if git diff --cached --quiet; then
            echo "Cooking index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update cooking index [CF-Pages-Skip]"
          git push
