name: Apply states readiness patch

on:
  push:
    paths:
      - scripts/apply-us-states-readiness-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted patch
        run: node scripts/apply-us-states-readiness-patch.mjs
      - name: Commit patched states app
        run: |
          if git diff --quiet -- study/us-states.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study/us-states.html
          git commit -m "Make states practice retrieval-aware"
          git push origin HEAD:main
