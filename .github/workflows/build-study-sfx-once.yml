name: Build Study SFX once

on:
  push:
    branches:
      - agent/word-expedition-battle-sfx
    paths:
      - .github/workflows/build-study-sfx-once.yml
      - .github/scripts/build-study-sfx.sh

permissions:
  contents: write

jobs:
  build-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/word-expedition-battle-sfx
          fetch-depth: 0
      - name: Build and verify final battle SFX bank
        run: |
          sed -i 's#scythe.mp3 0.34 0.31 0.94#scythe.mp3 0.30 0.27 0.94#' .github/scripts/build-study-sfx.sh
          sed -i 's#golem.mp3 0.33 0.30 0.88#golem.mp3 0.30 0.27 0.88#' .github/scripts/build-study-sfx.sh
          sed -i 's#owl.mp3   0.34 0.31 1.12#owl.mp3   0.30 0.27 1.12#' .github/scripts/build-study-sfx.sh
          bash .github/scripts/build-study-sfx.sh
