name: Build Study SFX once

on:
  push:
    branches:
      - agent/word-expedition-battle-sfx
    paths:
      - .github/workflows/build-study-sfx-once.yml
      - .github/scripts/build-study-sfx.sh

permissions:
  contents: write

jobs:
  build-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/word-expedition-battle-sfx
          fetch-depth: 0
      - name: Build and verify final battle SFX bank
        run: bash .github/scripts/build-study-sfx.sh
