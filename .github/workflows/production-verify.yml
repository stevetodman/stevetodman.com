name: Production verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      origin:
        description: Site origin to verify
        required: false
        default: https://stevetodman.com

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live deployment policy
        env:
          SITE_ORIGIN: ${{ github.event.inputs.origin || 'https://stevetodman.com' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            npm run verify:production && exit 0
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 20
          done
      - name: Record successful production verification
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ORIGIN: ${{ github.event.inputs.origin || 'https://stevetodman.com' }}
        run: |
          gh issue comment 38 --body "Production verification passed against ${VERIFIED_ORIGIN} for commit ${GITHUB_SHA}. The live production-only contract is verified automatically by \`npm run verify:production\`. Closing this cutover gate."
          gh issue close 38 --reason completed
          gh issue comment 40 --body "Issue #38 is now closed after a successful live production verification for commit ${GITHUB_SHA}. The live noindex/production-only gate is clear; search-engine removal can proceed."
