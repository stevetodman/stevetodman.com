name: Production verification

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Site origin to verify
        required: false
        default: https://stevetodman.com

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live deployment policy
        env:
          SITE_ORIGIN: ${{ inputs.origin }}
        run: npm run verify:production
