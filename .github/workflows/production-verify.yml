name: Production verification

on:
  push:
    branches:
      - main
    paths:
      - '_headers'
      - '_redirects'
      - 'robots.txt'
      - '404.html'
      - 'index.html'
      - 'cardio-hospital-3d/**'
      - 'scripts/build-hospital.mjs'
      - 'scripts/diagnose-hospital-live.mjs'
      - 'scripts/verify-production.mjs'
      - 'tests/hospital-csp.test.mjs'
      - 'tests/production-verifier.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/production-verify.yml'
      - '.github/workflows/hospital-live-runtime-diagnosis.yml'
      - '.github/workflows/hospital-production-guard.yml'
  workflow_dispatch:
    inputs:
      origin:
        description: Site origin to verify
        required: false
        default: https://stevetodman.com

permissions:
  contents: read
  checks: read
  issues: write

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for this commit's Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 72); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Cloudflare Pages" and .app.slug == "cloudflare-workers-and-pages")] | sort_by(.started_at) | last | .status // "missing"')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Cloudflare Pages" and .app.slug == "cloudflare-workers-and-pages")] | sort_by(.started_at) | last | .conclusion // ""')"
            echo "Cloudflare Pages: status=${status} conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              echo "Cloudflare Pages deployment failed with conclusion: $conclusion" >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for Cloudflare Pages to finish deploying commit ${GITHUB_SHA}." >&2
          exit 1
      - name: Verify live deployment policy
        env:
          SITE_ORIGIN: ${{ github.event.inputs.origin || 'https://stevetodman.com' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            npm run verify:production && exit 0
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 20
          done
      - name: Record successful production verification
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ORIGIN: ${{ github.event.inputs.origin || 'https://stevetodman.com' }}
        run: |
          gh issue comment 38 --body "Production verification passed against ${VERIFIED_ORIGIN} for commit ${GITHUB_SHA}. The live production-only contract is verified automatically by \`npm run verify:production\`. Closing this cutover gate."
          gh issue close 38 --reason completed
          gh issue comment 40 --body "Issue #38 is now closed after a successful live production verification for commit ${GITHUB_SHA}. The live noindex/production-only gate is clear; search-engine removal can proceed."
