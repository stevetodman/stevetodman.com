name: Study cloud canary

on:
  push:
    branches: [main]
    paths:
      - 'study/supabase/**'
      - 'scripts/verify-study-cloud.sh'
      - 'scripts/verify-study-reward-ledger.mjs'
      - '.github/workflows/study-cloud-canary.yml'
  pull_request:
    paths:
      - 'study/supabase/**'
      - 'scripts/verify-study-cloud.sh'
      - 'scripts/verify-study-reward-ledger.mjs'
      - '.github/workflows/study-cloud-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-canary:
    name: Study cloud canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Study cloud save
        run: bash scripts/verify-study-cloud.sh
      - name: Verify durable reward ledger with synthetic data
        run: node scripts/verify-study-reward-ledger.mjs
