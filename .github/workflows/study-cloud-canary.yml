name: Study cloud canary

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'study/supabase/**'
      - 'scripts/verify-study-cloud.sh'
      - 'scripts/verify-study-reward-ledger.mjs'
      - '.github/workflows/study-cloud-canary.yml'
  pull_request:
    paths:
      - 'study/supabase/**'
      - 'scripts/verify-study-cloud.sh'
      - 'scripts/verify-study-reward-ledger.mjs'
      - '.github/workflows/study-cloud-canary.yml'
  workflow_dispatch:

concurrency:
  group: study-cloud-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  cloud-canary:
    name: Study cloud canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Pin Sprint map-stat merge contract
        shell: bash
        run: |
          set -euo pipefail
          file='study/supabase/functions/studyhub-save/index.ts'
          grep -Fq 'mapCorrect?: number;' "$file"
          grep -Fq 'mapWrong?: number;' "$file"
          grep -Fq 'mapCorrect: Math.max(num(sa.mapCorrect), num(sb.mapCorrect))' "$file"
          grep -Fq 'mapWrong: Math.max(num(sa.mapWrong), num(sb.mapWrong))' "$file"
      - name: Verify live Study cloud save
        run: bash scripts/verify-study-cloud.sh
      - name: Verify durable reward ledger with synthetic data
        run: node scripts/verify-study-reward-ledger.mjs
      - name: Alert on cloud canary failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[automation] StudyHub cloud canary failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            const body = [
              'The scheduled synthetic StudyHub cloud verification failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'This alert contains no family token or live family data. Inspect the Actions run and Supabase function logs before changing production state.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
      - name: Close recovered cloud canary alert
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[automation] StudyHub cloud canary failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered: the StudyHub cloud canary is green again. Run: ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }
