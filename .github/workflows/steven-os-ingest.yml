name: Steven OS Ingest

on:
  workflow_run:
    workflows:
      - Tests
      - Cardio Hospital Unreal
    types:
      - completed
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to sync
        required: false
        default: '19'

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write

concurrency:
  group: steven-os-ingest-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync canonical project state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch workflow code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Cardio Hospital into Steven OS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEVEN_OS_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
        run: node steven-os/scripts/ingest-github-pr.mjs
