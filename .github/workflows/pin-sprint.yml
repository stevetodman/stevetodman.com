name: Pin Sprint targeted

on:
  pull_request:
    paths:
      - 'study/pin-sprint.html'
      - 'study/us-states.html'
      - 'tests/pin-sprint.test.mjs'
      - '.github/workflows/pin-sprint.yml'
  push:
    branches:
      - main
    paths:
      - 'study/pin-sprint.html'
      - 'study/us-states.html'
      - 'tests/pin-sprint.test.mjs'
      - '.github/workflows/pin-sprint.yml'
  workflow_dispatch:

concurrency:
  group: pin-sprint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Pin Sprint Chromium mobile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/pin-sprint.test.mjs
