name: Pin Sprint cloud contract

on:
  pull_request:
    paths:
      - 'study/supabase/functions/studyhub-save/index.ts'
      - '.github/workflows/pin-sprint-cloud.yml'
  push:
    branches:
      - main
    paths:
      - 'study/supabase/functions/studyhub-save/index.ts'
      - '.github/workflows/pin-sprint-cloud.yml'
  workflow_dispatch:

concurrency:
  group: pin-sprint-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Pin Sprint map-stat merge contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify map-specific counters survive cloud merge
        shell: bash
        run: |
          set -euo pipefail
          file='study/supabase/functions/studyhub-save/index.ts'
          grep -Fq 'mapCorrect?: number;' "$file"
          grep -Fq 'mapWrong?: number;' "$file"
          grep -Fq 'mapCorrect: Math.max(num(sa.mapCorrect), num(sb.mapCorrect))' "$file"
          grep -Fq 'mapWrong: Math.max(num(sa.mapWrong), num(sb.mapWrong))' "$file"
